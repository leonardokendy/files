<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>S.T.A.G.E</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5faff; margin: 0; padding: 0 0 60px 0; }
    header { background: #4a90e2; color: white; padding: 1rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .header-left { display: flex; align-items: center; gap: 1rem; }
    header img { height: 50px; }
    .header-title { display: flex; flex-direction: column; }
    h1 { font-size: 2rem; margin: 0; }
    .subtitle { font-size: 0.9rem; font-style: italic; margin-top: 0.2rem; }
    .login-btn { background: white; color: #4a90e2; font-weight: bold; padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; border: none; }
    #tagFilters { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 1rem 2rem 0; }
    .filter-tag { background: #e0e0e0; border: none; border-radius: 6px; padding: 0.4rem 0.8rem; cursor: pointer; font-size: 0.85rem; }
    .filter-tag.active { background: #4a90e2; color: white; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; padding: 2rem; max-width: 1200px; margin: 0 auto; }
    .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 1.5rem; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
    .card h2 { margin: 0.5rem 0; font-size: 1.2rem; }
    .card p { font-size: 0.95rem; color: #555; }
    .tag-container { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; margin-top: 0.5rem; }
    .tag { font-size: 0.75rem; color: #fff; background: #4a90e2; padding: 0.25rem 0.5rem; border-radius: 6px; }
    .card a { display: inline-block; background: #ffc107; color: #000; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: bold; margin-top: 0.5rem; }
    footer { position: fixed; bottom: 0; left: 0; right: 0; background: #4a90e2; display: flex; justify-content: center; gap: 2rem; padding: 0.75rem 0; z-index: 1000; }
    footer button { background: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: bold; cursor: pointer; }
    #homeView, #addNewView { display: none; }
    #homeView.active, #addNewView.active { display: block; }
    #editArea {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 2rem;
      padding: 2rem 0;
      max-width: 1000px;
      margin: 0 auto;
    }
    .edit-card, .preview-card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.09);
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      min-width: 340px;
      max-width: 400px;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .edit-card input[type="text"], .edit-card textarea {
      width: 100%;
      font-size: 1rem;
      border-radius: 7px;
      border: 1px solid #c9c9c9;
      padding: 0.7rem;
      margin-bottom: 0.2rem;
      box-sizing: border-box;
    }
    .edit-card textarea {
      min-height: 90px;
      max-width: 100%;
      resize: vertical;
    }
    .btn-actions {
      display: flex;
      gap: 1.1rem;
      margin-top: 1.3rem;
      justify-content: flex-end;
    }
    .btn-actions button {
      padding: 0.5rem 1.3rem;
      font-size: 1.02rem;
      border-radius: 7px;
      font-weight: bold;
      border: none;
      background: #4a90e2;
      color: #fff;
      cursor: pointer;
      transition: background 0.12s;
    }
    .btn-actions button:active { background: #306699; }
    .preview-card {
      align-items: center;
      justify-content: flex-start;
      text-align: center;
    }
    .preview-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 0.3rem;
      color: #222;
    }
    .preview-desc {
      font-size: 1.01rem;
      color: #444;
      margin-bottom: 0.6rem;
      min-height: 52px;
    }
    .preview-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      justify-content: center;
      margin-bottom: 0.7rem;
    }
    .preview-tag {
      background: #4a90e2;
      color: #fff;
      border-radius: 6px;
      font-size: 0.85rem;
      padding: 0.22rem 0.7rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .preview-link {
      display: inline-block;
      background: #ffc107;
      color: #000;
      text-decoration: none;
      padding: 0.7rem 2rem;
      border-radius: 7px;
      font-weight: bold;
      margin-top: 0.6rem;
      font-size: 1.08rem;
      transition: box-shadow .1s;
      box-shadow: 0 2px 6px #0001;
    }
    .preview-link:active { box-shadow: none; }
    #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #4caf50; color: white; padding: 1rem 2rem; border-radius: 8px; font-weight: bold; box-shadow: 0 4px 8px rgba(0,0,0,0.2); opacity: 0; transition: opacity 0.5s; z-index: 2000; }
    #toast.show { display: block; opacity: 1; }
    @media (max-width: 900px) {
      #editArea { flex-direction: column; align-items: stretch; }
      .edit-card, .preview-card { max-width: 100%; min-width: unset; }
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>
<header>
  <div class="header-left">
    <img src="https://springschool.me/wp-content/uploads/2020/12/SPRING-SCHOOL-LOGO-01.png" alt="Spring School Logo"/>
    <div class="header-title">
      <h1>S.T.A.G.E</h1>
      <div class="subtitle">Spring Teacher's Activity & Guidance Engine</div>
    </div>
  </div>
  <button class="login-btn" onclick="handleLogin()">Login</button>
</header>

<main id="homeView" class="active">
  <div id="tagFilters"></div>
  <div class="grid" id="homeGrid"></div>
</main>

<main id="addNewView">
  <div id="editArea"></div>
</main>

<footer>
  <button onclick="switchView('home')">🏠 Home</button>
  <button onclick="switchView('addNew')">➕ Add New</button>
</footer>
<div id="toast">💾 Jogos salvos com sucesso!</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAsYg7ZTHXD_a6d_icFLw9e5y0jSTfXBi0",
    authDomain: "spring-stage-by-leo.firebaseapp.com",
    projectId: "spring-stage-by-leo",
    storageBucket: "spring-stage-by-leo.firebasestorage.app",
    messagingSenderId: "215839443924",
    appId: "1:215839443924:web:16a9fae4a0a5da76f16441",
    measurementId: "G-JEE5SLV9YP"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let allGames = [];
  let selectedTags = [];
  let userLogged = false;

  auth.onAuthStateChanged(user => {
    if (user) {
      document.querySelector('.login-btn').textContent = user.displayName;
      document.querySelector('.login-btn').disabled = true;
      userLogged = true;
      loadFromFirebase();
    }

  function handleLogin() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider)
      .then(result => {
        document.querySelector('.login-btn').textContent = result.user.displayName;
        document.querySelector('.login-btn').disabled = true;
        userLogged = true;
        loadFromFirebase();
      .catch(error => console.error('Erro no login:', error));
  }

  function switchView(view) {
    if (view === 'addNew' && !userLogged) {
      showToast("⚠️ Faça login para acessar o cadastro.");
      return;
    }
    document.getElementById('homeView').classList.remove('active');
    document.getElementById('addNewView').classList.remove('active');
    document.getElementById(view + 'View').classList.add('active');
    if(view === 'addNew') showEditCard();
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  // ----------- EDIT MODE: APENAS 1 CARD -----------
  function showEditCard() {
  const editArea = document.getElementById('editArea');
  editArea.innerHTML = '';

  // 1. Card de edição
  const editCard = document.createElement('div');
  editCard.className = 'edit-card';

  const inputNome = document.createElement('input');
  inputNome.type = 'text';
  inputNome.placeholder = 'Game Name';
  inputNome.className = 'input-nome';

  const inputDesc = document.createElement('textarea');
  inputDesc.placeholder = 'Description';
  inputDesc.rows = 5;
  inputDesc.className = 'input-desc';

  const inputTags = document.createElement('input');
  inputTags.type = 'text';
  inputTags.placeholder = 'Tags (comma-separated)';
  inputTags.className = 'input-tags';

  const inputLink = document.createElement('input');
  inputLink.type = 'text';
  inputLink.placeholder = 'URL';
  inputLink.className = 'input-link';

  const btnContainer = document.createElement('div');
  btnContainer.className = 'btn-actions';
  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.textContent = 'Add';
  addBtn.onclick = function() { addGame(this); };
  btnContainer.appendChild(addBtn);

  editCard.appendChild(inputNome);
  editCard.appendChild(inputDesc);
  editCard.appendChild(inputTags);
  editCard.appendChild(inputLink);
  editCard.appendChild(btnContainer);

  // 2. More Info Card
  const moreCard = document.createElement('div');
  moreCard.className = 'edit-card';

  const inputMore = document.createElement('textarea');
  inputMore.placeholder = 'More Info';
  inputMore.rows = 10;
  inputMore.className = 'input-more';

  const tagSuggestions = document.createElement('div');
  tagSuggestions.className = 'tag-suggestions';
  tagSuggestions.style.display = 'flex';
  tagSuggestions.style.flexWrap = 'wrap';
  tagSuggestions.style.gap = '0.4rem';

  moreCard.appendChild(inputMore);
  moreCard.appendChild(tagSuggestions);

  // 3. Preview Card
  const previewCard = document.createElement('div');
  previewCard.className = 'preview-card';

  const title = document.createElement('div');
  title.className = 'preview-title';
  title.textContent = 'Game Name';

  const desc = document.createElement('div');
  desc.className = 'preview-desc';
  desc.textContent = 'Description';

  const tags = document.createElement('div');
  tags.className = 'preview-tags';

  const playBtn = document.createElement('a');
  playBtn.className = 'preview-link';
  playBtn.href = '#';
  playBtn.target = '_blank';
  playBtn.textContent = 'Play';

  const moreBtn = document.createElement('a');
  moreBtn.className = 'preview-more';
  moreBtn.href = 'javascript:void(0)';
  moreBtn.style.cssText = 'background:#eee; color:#000; margin-top:10px;';
  moreBtn.textContent = 'MORE';
  moreBtn.onclick = showMoreInfo;

  previewCard.appendChild(title);
  previewCard.appendChild(desc);
  previewCard.appendChild(tags);
  previewCard.appendChild(playBtn);
  previewCard.appendChild(moreBtn);

  // Sincronizar campos com preview
  inputNome.addEventListener('input', e => {
    title.textContent = e.target.value || 'Game Name';

  inputDesc.addEventListener('input', e => {
    desc.textContent = e.target.value || 'Description';

  inputTags.addEventListener('input', e => {
    const val = e.target.value;
    const arr = val.split(',').map(t => t.trim()).filter(Boolean);
    tags.innerHTML = '';
    arr.forEach(tag => {
      const span = document.createElement('span');
      span.className = 'preview-tag';
      span.textContent = tag;
      tags.appendChild(span);

  inputLink.addEventListener('input', e => {
    const val = e.target.value;
    playBtn.href = val || '#';
    playBtn.textContent = getLabelForLink(val);

  // Renderizar tags disponíveis
  db.collection("games").get().then(snapshot => {
    const allTags = [...new Set(snapshot.docs.flatMap(doc => {
      const tags = doc.data().tags || '';
      return tags.split(',').map(t => t.trim().toLowerCase());
    })];
    allTags.forEach(tag => {
      const btn = document.createElement('button');
      btn.textContent = tag;
      btn.style.cssText = 'font-size:0.8rem; padding:0.3rem 0.7rem; border-radius:5px; background:#4a90e2; color:white; border:none; cursor:pointer;';
      btn.onclick = () => {
        const current = inputTags.value.trim();
        const tagsArr = current ? current.split(',').map(t => t.trim()) : [];
        if (!tagsArr.includes(tag)) tagsArr.push(tag);
        inputTags.value = tagsArr.join(', ');
        inputTags.dispatchEvent(new Event('input'));
      };
      tagSuggestions.appendChild(btn);

  // Montar e adicionar ao DOM
  const container = document.createElement('div');
  container.style.display = 'flex';
  container.style.gap = '2rem';
  container.appendChild(editCard);
  container.appendChild(moreCard);
  container.appendChild(previewCard);
  editArea.appendChild(container);
    editCard.querySelector('.input-desc').addEventListener('input', e => {
      previewCard.querySelector('.preview-desc').textContent = e.target.value || 'Description';
    editCard.querySelector('.input-tags').addEventListener('input', e => {
      const val = e.target.value;
      const arr = val.split(',').map(t=>t.trim()).filter(Boolean);
      previewCard.querySelector('.preview-tags').innerHTML = arr.map(tag=>`<span class="preview-tag">${tag}</span>`).join('');
    editCard.querySelector('.input-link').addEventListener('input', e => {
      const val = e.target.value;
      const a = previewCard.querySelector('.preview-link');
      a.href = val || '#';
      a.textContent = getLabelForLink(val);

    // Renderiza as tags disponíveis no bloco do meio
    db.collection("games").get().then(snapshot => {
      const allTags = [...new Set(snapshot.docs.flatMap(doc => {
        const tags = doc.data().tags || '';
        return tags.split(',').map(t => t.trim().toLowerCase());
      })];
      const tagContainer = moreCard.querySelector('.tag-suggestions');
      const inputTags = editCard.querySelector('.input-tags');
      allTags.forEach(tag => {
        const btn = document.createElement('button');
        btn.textContent = tag;
        btn.style.cssText = 'font-size:0.8rem; padding:0.3rem 0.7rem; border-radius:5px; background:#4a90e2; color:white; border:none; cursor:pointer;';
        btn.onclick = () => {
          const current = inputTags.value.trim();
          const tags = current ? current.split(',').map(t => t.trim()) : [];
          if (!tags.includes(tag)) tags.push(tag);
          inputTags.value = tags.join(', ');
          inputTags.dispatchEvent(new Event('input')); // atualiza preview
        };
        tagContainer.appendChild(btn);

    // Container com os 3 blocos
    const container = document.createElement('div');
    container.style.display = 'flex';
    container.style.gap = '2rem';
    container.appendChild(editCard);
    container.appendChild(moreCard);
    container.appendChild(previewCard);

    editArea.appendChild(container);
    editCard.querySelector('.input-desc').addEventListener('input', e => {
      previewCard.querySelector('.preview-desc').textContent = e.target.value || 'Description';
    editCard.querySelector('.input-tags').addEventListener('input', e => {
      const val = e.target.value;
      const arr = val.split(',').map(t=>t.trim()).filter(Boolean);
      previewCard.querySelector('.preview-tags').innerHTML = arr.map(tag=>`<span class="preview-tag">${tag}</span>`).join('');
    editCard.querySelector('.input-link').addEventListener('input', e => {
      const val = e.target.value;
      const a = previewCard.querySelector('.preview-link');
      a.href = val || '#';
      a.textContent = getLabelForLink(val);

    // Container com os dois cartões lado a lado
    const container = document.createElement('div');
    container.style.display = 'flex';
    container.style.gap = '2rem';
    container.appendChild(editCard);
    container.appendChild(previewCard);

    // Adiciona ao editArea
    editArea.appendChild(container);
  }

  function getLabelForLink(link) {
    if (!link) return 'Play';
    return /\.(pdf|zip|docx?|xlsx?|pptx?|mp3|mp4)$/i.test(link) ? 'Download' : 'Play';
  }

  // Botão Add: salva no Firebase e limpa os campos!
  function addGame(btn) {
    const editCard = btn.closest('.edit-card');
    const nome = editCard.querySelector('.input-nome').value.trim();
    const descricao = editCard.querySelector('.input-desc').value.trim();
    const tags = editCard.querySelector('.input-tags').value.trim();
    const link = editCard.querySelector('.input-link').value.trim();
    const moreInfo = editCard.parentElement.querySelector('.input-more')?.value.trim() || '';
    if (!nome || !link) {
      showToast('⚠️ Preencha nome e link!');
      return;
    }
    db.collection('games').doc().set({nome, descricao, tags, link, moreInfo}
      .then(() => {
        showToast('✅ Jogo adicionado com sucesso!');
        // Limpa todos os campos do card editável
        editCard.querySelector('.input-nome').value = '';
        editCard.querySelector('.input-desc').value = '';
        editCard.querySelector('.input-tags').value = '';
        editCard.querySelector('.input-link').value = '';
        editCard.parentElement.querySelector('.input-more').value = '';
        // Limpa preview também
        const editArea = document.getElementById('editArea');
        const previewCard = editArea.querySelector('.preview-card');
        previewCard.querySelector('.preview-title').textContent = 'Game Name';
        previewCard.querySelector('.preview-desc').textContent = 'Description';
        previewCard.querySelector('.preview-tags').innerHTML = '';
        previewCard.querySelector('.preview-link').href = '#';
        previewCard.querySelector('.preview-link').textContent = 'Play';
        loadFromFirebase(); // atualiza home
  }
    db.collection('games').doc().set({nome, descricao, tags, link}
      .then(() => {
        showToast('✅ Jogo adicionado com sucesso!');
        // Limpa todos os campos do card editável
        editCard.querySelector('.input-nome').value = '';
        editCard.querySelector('.input-desc').value = '';
        editCard.querySelector('.input-tags').value = '';
        editCard.querySelector('.input-link').value = '';
        // Limpa preview também
        const editArea = document.getElementById('editArea');
        const previewCard = editArea.querySelector('.preview-card');
        previewCard.querySelector('.preview-title').textContent = 'Game Name';
        previewCard.querySelector('.preview-desc').textContent = 'Description';
        previewCard.querySelector('.preview-tags').innerHTML = '';
        previewCard.querySelector('.preview-link').href = '#';
        previewCard.querySelector('.preview-link').textContent = 'Play';
        loadFromFirebase(); // atualiza home
  }

  // ---- RESTANTE DA HOME E TAGS (INALTERADO) ----
  function renderCard(g) {
    const card = document.createElement('div');
    card.className = 'card';
    const isArquivo = g.link && /\.(pdf|zip|docx?|xlsx?|pptx?|mp3|mp4)$/i.test(g.link);
    const label = isArquivo ? 'Download' : 'Play';

    const a = document.createElement('a');
    a.href = g.link;
    a.textContent = label;
    a.target = '_blank';
    if (isArquivo) a.setAttribute('download', '');

    const moreBtn = document.createElement('a');
    moreBtn.href = "javascript:void(0)";
    moreBtn.textContent = "MORE";
    moreBtn.className = "more-button";
    moreBtn.style.cssText = "display:inline-block;background:#eee;color:#000;text-decoration:none;padding:0.5rem 1rem;border-radius:6px;font-weight:bold;margin-top:0.5rem;";
    moreBtn.onclick = () => {
      showMoreInfoFromCard(g.moreInfo || 'No additional information.');
    };

    const tagsArray = Array.isArray(g.tags)
      ? g.tags
      : g.tags.split(',').map(t => t.trim().toLowerCase());

    const tagContainer = document.createElement('div');
    tagContainer.className = 'tag-container';
    tagsArray.forEach(tag => {
      const tagDiv = document.createElement('div');
      tagDiv.className = 'tag';
      tagDiv.textContent = tag;
      tagContainer.appendChild(tagDiv);

    card.innerHTML = `<h2>${g.nome}</h2><p>${g.descricao}</p>`;
    card.appendChild(tagContainer);
    card.appendChild(a);
    card.appendChild(moreBtn);
    document.getElementById('homeGrid').appendChild(card);

    card.innerHTML = `
      <h2>${g.nome}</h2>
      <p>${g.descricao}</p>
    `;
    card.appendChild(tagContainer);
    card.appendChild(a);
    document.getElementById('homeGrid').appendChild(card);
  }

  function renderTagFilters() {
    const container = document.getElementById('tagFilters');
    container.innerHTML = '';
    const tags = [...new Set(allGames.flatMap(g => (Array.isArray(g.tags) ? g.tags : g.tags.split(',').map(t => t.trim().toLowerCase()))))];
    tags.forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'filter-tag';
      btn.textContent = tag;
      btn.onclick = () => toggleTag(tag, btn);
      container.appendChild(btn);
  }

  function toggleTag(tag, button) {
    button.classList.toggle('active');
    if (selectedTags.includes(tag)) {
      selectedTags = selectedTags.filter(t => t !== tag);
    } else {
      selectedTags.push(tag);
    }
    filterCards();
  }

  function filterCards() {
    const filtered = selectedTags.length === 0
      ? allGames
      : allGames.filter(g => {
          const tags = Array.isArray(g.tags) ? g.tags : g.tags.split(',').map(t => t.trim().toLowerCase());
          return selectedTags.every(tag => tags.includes(tag));
    document.getElementById('homeGrid').innerHTML = '';
    filtered.forEach(renderCard);
  }

  function loadFromFirebase() {
    db.collection("games").get().then(snapshot => {
      allGames = snapshot.docs.map(doc => doc.data());
      document.getElementById('homeGrid').innerHTML = '';
      allGames.forEach(renderCard);
      renderTagFilters();

function showMoreInfo() {
  const moreText = document.querySelector('.input-more')?.value || '';
  document.getElementById('moreInfoContent').textContent = moreText || 'No additional information.';
  document.getElementById('moreToast').style.display = 'block';
}
function closeMoreInfo() {
  document.getElementById('moreToast').style.display = 'none';
}
function showMoreInfoFromCard(text) {
  document.getElementById('moreInfoContent').textContent = text || 'No additional information.';
  document.getElementById('moreToast').style.display = 'block';
}



window.switchView = switchView;
window.handleLogin = handleLogin;
window.showMoreInfo = showMoreInfo;
window.closeMoreInfo = closeMoreInfo;
window.addGame = addGame;
</script>

<div id="moreToast" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; color:black; padding:2rem; border-radius:10px; box-shadow:0 0 20px rgba(0,0,0,0.3); z-index:3000; max-width:90%; max-height:80%; overflow:auto;">
  <button onclick="closeMoreInfo()" style="position:absolute; top:10px; right:15px; background:none; border:none; font-size:1.2rem; font-weight:bold; cursor:pointer;">✖</button>
  <div id="moreInfoContent">...</div>
</div>
