<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>S.T.A.G.E</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5faff; margin: 0; padding: 0 0 60px 0; }
    header { background: #4a90e2; color: white; padding: 1rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .header-left { display: flex; align-items: center; gap: 1rem; }
    header img { height: 50px; }
    .header-title { display: flex; flex-direction: column; }
    h1 { font-size: 2rem; margin: 0; }
    .subtitle { font-size: 0.9rem; font-style: italic; margin-top: 0.2rem; }
    .login-btn { background: white; color: #4a90e2; font-weight: bold; padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; border: none; }
    #tagFilters { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 1rem 2rem 0; }
    .filter-tag { background: #e0e0e0; border: none; border-radius: 6px; padding: 0.4rem 0.8rem; cursor: pointer; font-size: 0.85rem; }
    .filter-tag.active { background: #4a90e2; color: white; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; padding: 2rem; max-width: 1200px; margin: 0 auto; }
    .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 1.5rem; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
    .card h2 { margin: 0.5rem 0; font-size: 1.2rem; }
    .card p { font-size: 0.95rem; color: #555; }
    .tag-container { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; margin-top: 0.5rem; }
    .tag { font-size: 0.75rem; color: #fff; background: #4a90e2; padding: 0.25rem 0.5rem; border-radius: 6px; }
    .card a { display: inline-block; background: #ffc107; color: #000; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: bold; margin-top: 0.5rem; }
    footer { position: fixed; bottom: 0; left: 0; right: 0; background: #4a90e2; display: flex; justify-content: center; gap: 2rem; padding: 0.75rem 0; z-index: 1000; }
    footer button { background: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: bold; cursor: pointer; }
    #homeView, #addNewView { display: none; }
    #homeView.active, #addNewView.active { display: block; }
    #editArea {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 2rem;
      padding: 2rem 0;
      max-width: 1200px;
      margin: 0 auto;
    }
    .edit-card, .middle-card, .preview-card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.09);
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      min-width: 220px;
      max-width: 330px;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .edit-card input[type="text"], .edit-card textarea,
    .middle-card textarea, .middle-card input[type="text"] {
      width: 100%;
      font-size: 1rem;
      border-radius: 7px;
      border: 1px solid #c9c9c9;
      padding: 0.7rem;
      margin-bottom: 0.2rem;
      box-sizing: border-box;
    }
    .edit-card textarea, .middle-card textarea {
      min-height: 60px;
      max-width: 100%;
      resize: vertical;
    }
    .middle-card {
      background: #f8fafd;
      min-width: 180px;
      max-width: 210px;
      min-height: 180px;
      align-items: stretch;
      justify-content: flex-start;
      gap: 1rem;
      box-shadow: 0 2px 8px #0001;
      padding: 1.2rem 1rem;
    }
    .btn-actions {
      display: flex;
      gap: 1.1rem;
      margin-top: 1.3rem;
      justify-content: flex-end;
    }
    .btn-actions button {
      padding: 0.5rem 1.3rem;
      font-size: 1.02rem;
      border-radius: 7px;
      font-weight: bold;
      border: none;
      background: #4a90e2;
      color: #fff;
      cursor: pointer;
      transition: background 0.12s;
    }
    .btn-actions button:active { background: #306699; }
    .preview-card {
      align-items: center;
      justify-content: flex-start;
      text-align: center;
    }
    .preview-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 0.3rem;
      color: #222;
    }
    .preview-desc {
      font-size: 1.01rem;
      color: #444;
      margin-bottom: 0.6rem;
      min-height: 52px;
    }
    .preview-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      justify-content: center;
      margin-bottom: 0.7rem;
    }
    .preview-tag {
      background: #4a90e2;
      color: #fff;
      border-radius: 6px;
      font-size: 0.85rem;
      padding: 0.22rem 0.7rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .preview-moreinfo {
      display: none;
      background: #e0e7ef;
      color: #2a4062;
      border: none;
      padding: 0.48rem 1rem;
      border-radius: 7px;
      font-weight: bold;
      margin-bottom: 0.7rem;
      box-shadow: 0 1px 4px #0002;
      font-size: 0.97rem;
      cursor: pointer;
      transition: background 0.13s;
    }
    .preview-link {
      display: inline-block;
      background: #ffc107;
      color: #000;
      text-decoration: none;
      padding: 0.7rem 2rem;
      border-radius: 7px;
      font-weight: bold;
      margin-top: 0.6rem;
      font-size: 1.08rem;
      transition: box-shadow .1s;
      box-shadow: 0 2px 6px #0001;
    }
    .preview-link:active { box-shadow: none; }
    #toast { 
      position: fixed; 
      bottom: 80px; 
      left: 50%; 
      transform: translateX(-50%); 
      background: #4caf50; 
      color: white; 
      padding: 1rem 2rem; 
      border-radius: 8px; 
      font-weight: bold; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.2); 
      opacity: 0; 
      transition: opacity 0.5s; 
      z-index: 2000; 
      display: none;
    }
    #toast.show { display: block; opacity: 1; }
    .error-toast { background: #f44336 !important; }
    .warning-toast { background: #ff9800 !important; }
    .loading { 
      display: none; 
      text-align: center; 
      padding: 2rem; 
      color: #666; 
    }
    
    /* Melhor responsividade */
    @media (max-width: 1100px) {
      #editArea { flex-direction: column; align-items: stretch; }
      .edit-card, .middle-card, .preview-card { max-width: 100%; min-width: unset; }
    }
    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; padding: 1rem; }
      header { flex-direction: column; gap: 1rem; text-align: center; }
      #tagFilters { padding: 1rem; }
      footer { gap: 1rem; }
      footer button { font-size: 0.9rem; padding: 0.4rem 0.8rem; }
    }
    @media (max-width: 480px) {
      h1 { font-size: 1.5rem; }
      .card { padding: 1rem; }
      #editArea { padding: 1rem 0; }
    }
  </style>
</head>
<body>
<header>
  <div class="header-left">
    <img src="https://springschool.me/wp-content/uploads/2020/12/SPRING-SCHOOL-LOGO-01.png" alt="Spring School Logo"/>
    <div class="header-title">
      <h1>S.T.A.G.E</h1>
      <div class="subtitle">Spring Teacher's Activity & Guidance Engine</div>
    </div>
  </div>
  <button class="login-btn" onclick="handleLogin()">Login</button>
</header>

<main id="homeView" class="active">
  <div class="loading" id="loading">Carregando jogos...</div>
  <div id="tagFilters"></div>
  <div class="grid" id="homeGrid"></div>
</main>

<main id="addNewView">
  <div id="editArea"></div>
</main>

<footer>
  <button onclick="switchView('home')">🏠 Home</button>
  <button onclick="switchView('addNew')">➕ Add New</button>
</footer>
<div id="toast">💾 Jogos salvos com sucesso!</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
  // Verificação se Firebase carregou
  if (typeof firebase === 'undefined') {
    showToast('❌ Erro: Firebase não carregou. Verifique sua conexão.', 'error');
    console.error('Firebase CDN failed to load');
  }

  const firebaseConfig = {
    apiKey: "AIzaSyAsYg7ZTHXD_a6d_icFLw9e5y0jSTfXBi0",
    authDomain: "spring-stage-by-leo.firebaseapp.com",
    projectId: "spring-stage-by-leo",
    storageBucket: "spring-stage-by-leo.appspot.com",
    messagingSenderId: "215839443924",
    appId: "1:215839443924:web:16a9fae4a0a5da76f16441",
    measurementId: "G-JEE5SLV9YP"
  };

  let auth, db;
  let allGames = [];
  let selectedTags = []; // Agora sempre em lowercase para consistência
  let userLogged = false;
  let currentEditListeners = []; // Para track de event listeners

  // Inicialização segura do Firebase
  function initFirebase() {
    try {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        db = firebase.firestore();
        
        auth.onAuthStateChanged(user => {
          if (user) {
            safeUpdateElement('.login-btn', el => {
              el.textContent = user.displayName || 'Usuário';
              el.disabled = true;
            });
            userLogged = true;
            loadFromFirebase();
          }
        });
      } else {
        throw new Error('Firebase não disponível');
      }
    } catch (error) {
      console.error('Erro ao inicializar Firebase:', error);
      showToast('❌ Erro de conexão. Algumas funcionalidades podem não funcionar.', 'error');
    }
  }

  // Função auxiliar para atualizações seguras do DOM
  function safeUpdateElement(selector, updateFn) {
    const element = document.querySelector(selector);
    if (element) {
      updateFn(element);
    } else {
      console.warn(`Elemento não encontrado: ${selector}`);
    }
  }

  function safeGetElement(id) {
    const element = document.getElementById(id);
    if (!element) {
      console.warn(`Elemento não encontrado: ${id}`);
    }
    return element;
  }

  function handleLogin() {
    if (typeof firebase === 'undefined' || !auth) {
      showToast('❌ Serviço de login não disponível.', 'error');
      return;
    }

    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider)
      .then(result => {
        safeUpdateElement('.login-btn', el => {
          el.textContent = result.user.displayName || 'Usuário';
          el.disabled = true;
        });
        userLogged = true;
        showToast('✅ Login realizado com sucesso!');
        loadFromFirebase();
      })
      .catch(error => {
        console.error('Erro no login:', error);
        showToast('❌ Erro no login. Tente novamente.', 'error');
      });
  }

  function switchView(view) {
    // Validação de entrada
    if (!view || typeof view !== 'string') {
      console.error('View inválida:', view);
      return;
    }

    if (view === 'addNew' && !userLogged) {
      showToast("⚠️ Faça login para acessar o cadastro.", 'warning');
      return;
    }

    // Verificação segura dos elementos
    const homeView = safeGetElement('homeView');
    const addNewView = safeGetElement('addNewView');
    const targetView = safeGetElement(view + 'View');

    if (!homeView || !addNewView || !targetView) {
      console.error('Elementos de view não encontrados');
      return;
    }

    // Atualização segura das classes
    homeView.classList.remove('active');
    addNewView.classList.remove('active');
    targetView.classList.add('active');
    
    if (view === 'addNew') {
      showEditCard();
    }
  }

  function showToast(msg, type = 'success') {
    const toast = safeGetElement('toast');
    if (!toast) return;

    toast.textContent = msg;
    toast.className = `show ${type ? type + '-toast' : ''}`;
    
    setTimeout(() => {
      toast.classList.remove('show');
      // Limpa classes de tipo após animação
      setTimeout(() => {
        toast.className = '';
      }, 500);
    }, 4000); // Aumentado para 4 segundos
  }

  function showLoading(show = true) {
    const loading = safeGetElement('loading');
    if (loading) {
      loading.style.display = show ? 'block' : 'none';
    }
  }

  // Função para limpar event listeners antigos
  function clearEditListeners() {
    currentEditListeners.forEach(({ element, event, handler }) => {
      if (element) {
        element.removeEventListener(event, handler);
      }
    });
    currentEditListeners = [];
  }

  // Função auxiliar para adicionar listeners rastreáveis
  function addTrackedListener(element, event, handler) {
    if (element) {
      element.addEventListener(event, handler);
      currentEditListeners.push({ element, event, handler });
    }
  }

  function showEditCard() {
    const editArea = safeGetElement('editArea');
    if (!editArea) return;

    // Limpa listeners antigos antes de criar novos
    clearEditListeners();
    editArea.innerHTML = '';

    // Bloco de edição à esquerda
    const editCard = document.createElement('div');
    editCard.className = 'edit-card';
    editCard.innerHTML = `
      <input type="text" class="input-nome" placeholder="Game Name">
      <textarea class="input-desc" placeholder="Description" rows="4"></textarea>
      <input type="text" class="input-tags" placeholder="Tags (comma-separated)">
      <input type="text" class="input-link" placeholder="URL">
      <div class="btn-actions">
        <button type="button" onclick="addGame(this)">Add</button>
      </div>
    `;

    // Bloco do meio: more info + button text
    const middleCard = document.createElement('div');
    middleCard.className = 'middle-card';
    middleCard.innerHTML = `
      <textarea class="input-moreinfo" placeholder="More info (opcional)"></textarea>
      <input type="text" class="input-btntext" placeholder="Button text (Play, Download, Watch...)">
    `;

    // Bloco de preview à direita
    const previewCard = document.createElement('div');
    previewCard.className = 'preview-card';
    previewCard.innerHTML = `
      <div class="preview-title">Game Name</div>
      <div class="preview-desc">Description</div>
      <div class="preview-tags"></div>
      <button class="preview-moreinfo" style="display:none; margin-bottom:0.7rem;"></button>
      <a class="preview-link" href="#" target="_blank">Play</a>
    `;

    // Event listeners com rastreamento
    const inputs = {
      nome: editCard.querySelector('.input-nome'),
      desc: editCard.querySelector('.input-desc'),
      tags: editCard.querySelector('.input-tags'),
      link: editCard.querySelector('.input-link'),
      moreinfo: middleCard.querySelector('.input-moreinfo'),
      btntext: middleCard.querySelector('.input-btntext')
    };

    const previews = {
      title: previewCard.querySelector('.preview-title'),
      desc: previewCard.querySelector('.preview-desc'),
      tags: previewCard.querySelector('.preview-tags'),
      moreinfo: previewCard.querySelector('.preview-moreinfo'),
      link: previewCard.querySelector('.preview-link')
    };

    // Handlers dos event listeners
    const handlers = {
      nome: (e) => {
        previews.title.textContent = e.target.value || 'Game Name';
      },
      desc: (e) => {
        previews.desc.textContent = e.target.value || 'Description';
      },
      tags: (e) => {
        const val = e.target.value;
        const arr = val.split(',').map(t => t.trim()).filter(Boolean);
        previews.tags.innerHTML = arr.map(tag => `<span class="preview-tag">${escapeHtml(tag)}</span>`).join('');
      },
      link: (e) => {
        const val = e.target.value;
        previews.link.href = val || '#';
        const btnText = inputs.btntext.value;
        previews.link.textContent = btnText || getLabelForLink(val);
      },
      moreinfo: (e) => {
        const val = e.target.value.trim();
        if (val) {
          previews.moreinfo.textContent = val;
          previews.moreinfo.style.display = '';
        } else {
          previews.moreinfo.style.display = 'none';
        }
      },
      btntext: (e) => {
        const val = e.target.value;
        const urlVal = inputs.link.value;
        previews.link.textContent = val || getLabelForLink(urlVal);
      }
    };

    // Adiciona listeners rastreados
    Object.keys(handlers).forEach(key => {
      if (inputs[key]) {
        addTrackedListener(inputs[key], 'input', handlers[key]);
      }
    });

    // Container com layout responsivo
    const container = document.createElement('div');
    container.style.display = 'flex';
    container.style.gap = '2rem';
    container.style.flexWrap = 'wrap';
    container.appendChild(editCard);
    container.appendChild(middleCard);
    container.appendChild(previewCard);

    editArea.appendChild(container);
  }

  // Função para escapar HTML e prevenir XSS
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function getLabelForLink(link) {
    if (!link) return 'Play';
    return /\.(pdf|zip|docx?|xlsx?|pptx?|mp3|mp4)$/i.test(link) ? 'Download' : 'Play';
  }

  // Validação e sanitização de dados
  function validateGameData(data) {
    const errors = [];
    
    if (!data.nome || data.nome.trim().length === 0) {
      errors.push('Nome é obrigatório');
    }
    if (!data.link || data.link.trim().length === 0) {
      errors.push('Link é obrigatório');
    }
    if (data.link && !isValidUrl(data.link)) {
      errors.push('URL inválida');
    }
    
    return {
      isValid: errors.length === 0,
      errors
    };
  }

  function isValidUrl(string) {
    try {
      new URL(string);
      return true;
    } catch (_) {
      return false;
    }
  }

  function sanitizeGameData(data) {
    return {
      nome: (data.nome || '').trim(),
      descricao: (data.descricao || '').trim(),
      tags: (data.tags || '').trim(),
      link: (data.link || '').trim(),
      moreinfo: data.moreinfo && data.moreinfo.trim() ? data.moreinfo.trim() : null,
      buttonText: (data.buttonText || '').trim()
    };
  }

  function addGame(btn) {
    if (!db) {
      showToast('❌ Banco de dados não disponível.', 'error');
      return;
    }

    const editArea = safeGetElement('editArea');
    if (!editArea) return;

    const editCard = editArea.querySelector('.edit-card');
    const middleCard = editArea.querySelector('.middle-card');
    
    if (!editCard || !middleCard) {
      showToast('❌ Erro interno. Recarregue a página.', 'error');
      return;
    }

    const rawData = {
      nome: editCard.querySelector('.input-nome')?.value || '',
      descricao: editCard.querySelector('.input-desc')?.value || '',
      tags: editCard.querySelector('.input-tags')?.value || '',
      link: editCard.querySelector('.input-link')?.value || '',
      moreinfo: middleCard.querySelector('.input-moreinfo')?.value || '',
      buttonText: middleCard.querySelector('.input-btntext')?.value || ''
    };

    // Validação
    const validation = validateGameData(rawData);
    if (!validation.isValid) {
      showToast(`⚠️ ${validation.errors.join(', ')}`, 'warning');
      return;
    }

    // Sanitização
    const gameData = sanitizeGameData(rawData);

    // Desabilita botão durante o salvamento
    btn.disabled = true;
    btn.textContent = 'Salvando...';

    db.collection('games').doc().set(gameData)
      .then(() => {
        showToast('✅ Jogo adicionado com sucesso!');
        clearEditForm(editArea);
        loadFromFirebase();
      })
      .catch(error => {
        console.error('Erro ao salvar:', error);
        showToast('❌ Erro ao salvar jogo. Tente novamente.', 'error');
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = 'Add';
      });
  }

  function clearEditForm(editArea) {
    const inputs = editArea.querySelectorAll('input, textarea');
    inputs.forEach(input => {
      input.value = '';
      // Dispara evento para atualizar preview
      input.dispatchEvent(new Event('input'));
    });
  }

  // Renderização segura de cards
  function renderCard(g) {
    // Validação de dados
    if (!g || typeof g !== 'object') {
      console.warn('Dados de jogo inválidos:', g);
      return;
    }

    const card = document.createElement('div');
    card.className = 'card';
    
    // Sanitização e valores padrão
    const nome = escapeHtml(g.nome || 'Sem nome');
    const descricao = escapeHtml(g.descricao || 'Sem descrição');
    const link = g.link || '#';
    
    const isArquivo = link !== '#' && /\.(pdf|zip|docx?|xlsx?|pptx?|mp3|mp4)$/i.test(link);
    const label = (g.buttonText && g.buttonText.trim()) ? 
                  escapeHtml(g.buttonText) : 
                  (isArquivo ? 'Download' : 'Play');

    // Elemento link
    const a = document.createElement('a');
    a.href = link;
    a.textContent = label;
    a.target = '_blank';
    if (isArquivo) a.setAttribute('download', '');

    // Processamento de tags
    let tagsArray = [];
    if (Array.isArray(g.tags)) {
      tagsArray = g.tags;
    } else if (typeof g.tags === "string" && g.tags.trim()) {
      tagsArray = g.tags.split(',').map(t => t.trim()).filter(Boolean);
    }

    const tagContainer = document.createElement('div');
    tagContainer.className = 'tag-container';
    tagsArray.forEach(tag => {
      const tagDiv = document.createElement('div');
      tagDiv.className = 'tag';
      tagDiv.textContent = escapeHtml(tag);
      tagContainer.appendChild(tagDiv);
    });

    // Construção do card
    card.innerHTML = `
      <h2>${nome}</h2>
      <p>${descricao}</p>
    `;
    card.appendChild(tagContainer);

    // Botão more info (validação segura)
    if (g.moreinfo && typeof g.moreinfo === "string" && g.moreinfo.trim().length > 0) {
      const infoBtn = document.createElement('button');
      infoBtn.className = 'preview-moreinfo';
      infoBtn.textContent = escapeHtml(g.moreinfo);
      infoBtn.style.display = '';
      infoBtn.style.marginBottom = '0.7rem';
      infoBtn.onclick = () => alert(g.moreinfo);
      card.appendChild(infoBtn);
    }

    card.appendChild(a);
    
    const homeGrid = safeGetElement('homeGrid');
    if (homeGrid) {
      homeGrid.appendChild(card);
    }
  }

  function renderTagFilters() {
    const container = safeGetElement('tagFilters');
    if (!container) return;

    container.innerHTML = '';
    
    // Extração segura de tags
    let tagsRaw = [];
    allGames.forEach(g => {
      if (!g) return;
      
      let arr = [];
      if (Array.isArray(g.tags)) {
        arr = g.tags;
      } else if (typeof g.tags === "string" && g.tags.trim()) {
        arr = g.tags.split(',').map(t => t.trim()).filter(Boolean);
      }
      tagsRaw = tagsRaw.concat(arr);
    });

    // Agrupamento mantendo primeira capitalização
    let tagsDict = {};
    tagsRaw.forEach(t => {
      if (t && typeof t === 'string') {
        const lower = t.toLowerCase();
        if (!tagsDict[lower]) {
          tagsDict[lower] = t;
        }
      }
    });

    const tags = Object.values(tagsDict);

    tags.forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'filter-tag';
      btn.textContent = escapeHtml(tag);
      btn.onclick = () => toggleTag(tag, btn);
      
      // Verifica se tag está ativa (comparação case-insensitive)
      if (selectedTags.includes(tag.toLowerCase())) {
        btn.classList.add('active');
      }
      
      container.appendChild(btn);
    });
  }

  function toggleTag(tag, button) {
    if (!tag || !button) return;
    
    button.classList.toggle('active');
    const tagLower = tag.toLowerCase();
    
    if (selectedTags.includes(tagLower)) {
      selectedTags = selectedTags.filter(t => t !== tagLower);
    } else {
      selectedTags.push(tagLower);
    }
    
    filterCards();
  }

  function filterCards() {
    // Validação de dados
    if (!Array.isArray(allGames)) {
      console.warn('allGames não é um array válido');
      return;
    }

    const filtered = selectedTags.length === 0 ? allGames : allGames.filter(g => {
      if (!g || typeof g !== 'object') return false;
      
      let tagsArray = [];
      if (Array.isArray(g.tags)) {
        tagsArray = g.tags;
      } else if (typeof g.tags === "string" && g.tags.trim()) {
        tagsArray = g.tags.split(',').map(t => t.trim()).filter(Boolean);
      }
      
      // Comparação case-insensitive
      const tagsLower = tagsArray.map(t => t.toLowerCase());
      return selectedTags.every(tag => tagsLower.includes(tag));
    });

    const homeGrid = safeGetElement('homeGrid');
    if (homeGrid) {
      homeGrid.innerHTML = '';
      filtered.forEach(renderCard);
    }
  }

  function loadFromFirebase() {
    if (!db) {
      showToast('❌ Banco de dados não disponível.', 'error');
      return;
    }

    showLoading(true);
    
    db.collection("games").get()
      .then(snapshot => {
        try {
          allGames = snapshot.docs.map(doc => {
            const data = doc.data();
            // Validação básica dos dados
            return {
              nome: data.nome || '',
              descricao: data.descricao || '',
              tags: data.tags || '',
              link: data.link || '',
              moreinfo: data.moreinfo || null,
              buttonText: data.buttonText || ''
            };
          });
          
          const homeGrid = safeGetElement('homeGrid');
          if (homeGrid) {
            homeGrid.innerHTML = '';
            allGames.forEach(renderCard);
          }
          
          renderTagFilters();
          showLoading(false);
          
          if (allGames.length === 0) {
            showToast('ℹ️ Nenhum jogo encontrado. Adicione o primeiro!', 'warning');
          }
        } catch (error) {
          console.error('Erro ao processar dados:', error);
          showToast('❌ Erro ao processar dados dos jogos.', 'error');
          showLoading(false);
        }
      })
      .catch(error => {
        console.error('Erro ao carregar do Firebase:', error);
        showToast('❌ Erro ao carregar jogos. Verifique sua conexão.', 'error');
        showLoading(false);
        
        // Fallback: tenta carregar dados do localStorage
        loadFromLocalStorage();
      });
  }

  // Fallback para localStorage em caso de erro do Firebase
  function loadFromLocalStorage() {
    try {
      const saved = localStorage.getItem('stage_games_backup');
      if (saved) {
        allGames = JSON.parse(saved);
        const homeGrid = safeGetElement('homeGrid');
        if (homeGrid) {
          homeGrid.innerHTML = '';
          allGames.forEach(renderCard);
        }
        renderTagFilters();
        showToast('ℹ️ Carregados dados salvos localmente.', 'warning');
      }
    } catch (error) {
      console.error('Erro ao carregar backup local:', error);
    }
  }

  // Backup automático no localStorage
  function backupToLocalStorage() {
    try {
      localStorage.setItem('stage_games_backup', JSON.stringify(allGames));
    } catch (error) {
      console.warn('Não foi possível fazer backup local:', error);
    }
  }

  // Funcionalidades adicionais de segurança
  function handleConnectionLoss() {
    window.addEventListener('online', () => {
      showToast('✅ Conexão restaurada!');
      if (userLogged) {
        loadFromFirebase();
      }
    });

    window.addEventListener('offline', () => {
      showToast('⚠️ Sem conexão. Algumas funcionalidades podem não funcionar.', 'warning');
    });
  }

  // Tratamento de erros globais
  window.addEventListener('error', (event) => {
    console.error('Erro global capturado:', event.error);
    if (event.error && event.error.message) {
      if (event.error.message.includes('Firebase') || event.error.message.includes('auth')) {
        showToast('❌ Erro de conexão com o servidor.', 'error');
      }
    }
  });

  // Tratamento de promises rejeitadas
  window.addEventListener('unhandledrejection', (event) => {
    console.error('Promise rejeitada:', event.reason);
    event.preventDefault(); // Previne logs desnecessários no console
  });

  // Inicialização quando a página carregar
  document.addEventListener('DOMContentLoaded', () => {
    try {
      initFirebase();
      handleConnectionLoss();
      
      // Carrega dados iniciais mesmo sem login (dados públicos)
      if (!userLogged) {
        // Pode carregar dados públicos ou mostrar mensagem
        showToast('ℹ️ Faça login para acessar todos os recursos.', 'warning');
      }
    } catch (error) {
      console.error('Erro na inicialização:', error);
      showToast('❌ Erro ao inicializar aplicação.', 'error');
    }
  });

  // Função de cleanup quando usuário sai da página
  window.addEventListener('beforeunload', () => {
    clearEditListeners();
    backupToLocalStorage();
  });

  // Exportar funções para debug (apenas em desenvolvimento)
  if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
    window.stageDebug = {
      allGames,
      selectedTags,
      userLogged,
      loadFromFirebase,
      clearEditListeners,
      showToast
    };
  }
