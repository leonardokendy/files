<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPRINT - Spring Platform</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5faff;
      margin: 0;
      padding: 0 0 60px 0;
    }
    header {
      background: #4a90e2;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    header h1 {
      font-size: 2.2rem;
      margin: 0;
    }
    header p {
      font-size: 0.95rem;
      margin: 0.25rem 0 0;
      font-style: italic;
    }
    #userControls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      padding: 1rem;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 1.2rem;
      text-align: center;
    }
    .card h2 {
      margin: 0.2rem 0;
      font-size: 1.2rem;
    }
    .card .creator {
      font-size: 0.75rem;
      color: #777;
      margin-bottom: 0.5rem;
    }
    .card p {
      font-size: 0.95rem;
      color: #555;
    }
    .card .tag {
      font-size: 0.75rem;
      color: #fff;
      background: #4a90e2;
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      margin: 0.5rem 0 0.25rem;
    }
    .card .btn-row {
      margin-top: 0.5rem;
    }
    .card a {
      display: inline-block;
      margin-top: 0.2rem;
      background: #ffc107;
      color: #000;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: bold;
    }
    #tagFilters {
      text-align: center;
      padding: 1rem 0 0.5rem;
    }
    #tagFilters button {
      margin: 0.25rem;
      padding: 0.25rem 0.75rem;
      border-radius: 6px;
      border: none;
      background: #ddd;
      cursor: pointer;
    }
    #tagFilters button.active {
      background: #4a90e2;
      color: white;
    }
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #4a90e2;
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 0.75rem 0;
      z-index: 1000;
    }
    footer button {
      background: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>SPRINT</h1>
    <p>Spring Platform for Resources, Ideas, Notes and Tools</p>
  </header>

  <div id="userControls">
    <div>
      <button id="loginBtn">🔐 Login</button>
      <span id="userInfo"></span>
    </div>
  </div>

  <div id="tagFilters"></div>
  <main id="homeView" class="grid active"></main>

  <main id="databaseView">
    <div class="btn-bar">
      <button onclick="addRow()">➕ Add Game</button>
      <button onclick="saveToFirebase()">💾 Salvar</button>
      <select onchange="sortGames(this.value)">
        <option value="nome">🔤 Ordenar por Nome</option>
        <option value="tags">🏷️ Ordenar por Tags</option>
      </select>
    </div>
    <table>
      <thead>
        <tr>
          <th>Nome do Jogo</th>
          <th>Link</th>
          <th>Descrição</th>
          <th>Tags</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="gameTable"></tbody>
    </table>
  </main>

  <footer>
    <button onclick="switchView('home')">🏠 Home</button>
    <button onclick="switchView('database')">🗂️ Database</button>
  </footer>

  <script>
    const selectedTags = new Set();

    function renderTagsFilter(tags) {
      const container = document.getElementById('tagFilters');
      container.innerHTML = '';
      [...tags].sort().forEach(tag => {
        const btn = document.createElement('button');
        btn.textContent = tag;
        btn.onclick = () => {
          if (selectedTags.has(tag)) {
            selectedTags.delete(tag);
            btn.classList.remove('active');
          } else {
            selectedTags.add(tag);
            btn.classList.add('active');
          }
          filterCardsByTags();
        };
        container.appendChild(btn);
      });
    }

    function filterCardsByTags() {
      const cards = document.querySelectorAll('.card');
      if (selectedTags.size === 0) {
        cards.forEach(card => card.style.display = 'block');
        return;
      }
      cards.forEach(card => {
        const cardTags = (card.dataset.tags || '').split(',').map(t => t.trim());
        const show = [...selectedTags].some(tag => cardTags.includes(tag));
        card.style.display = show ? 'block' : 'none';
      });
    }

    function renderCard(jogo) {
      const home = document.getElementById('homeView');
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.tags = jogo.tags || '';

      const title = document.createElement('h2');
      title.textContent = jogo.nome;

      const creator = document.createElement('div');
      creator.className = 'creator';
      creator.textContent = `Created by ${jogo.author || 'Unknown'}`;

      const desc = document.createElement('p');
      desc.textContent = jogo.descricao;

      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.textContent = jogo.tags;

      const btnRow = document.createElement('div');
      btnRow.className = 'btn-row';
      const btn = document.createElement('a');
      btn.href = jogo.link;
      btn.textContent = "Jogar";
      btnRow.appendChild(btn);

      card.appendChild(title);
      card.appendChild(creator);
      card.appendChild(desc);
      card.appendChild(tag);
      card.appendChild(btnRow);

      home.appendChild(card);
    }
  </script>
</body>
</html>
