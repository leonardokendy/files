<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>S.T.A.G.E - Spring Platform</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5faff; margin: 0; padding-bottom: 60px; }
    header { background: #4a90e2; color: white; padding: 1rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .header-left { display: flex; align-items: center; gap: 1rem; }
    header img { height: 50px; }
    .header-title { display: flex; flex-direction: column; }
    h1 { font-size: 2rem; margin: 0; }
    .subtitle { font-size: 0.9rem; font-style: italic; margin-top: 0.2rem; }
    .login-btn { background: white; color: #4a90e2; font-weight: bold; padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; border: none; }
    #tagFilters { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 1rem 2rem 0; }
    .filter-tag { background: #e0e0e0; border: none; border-radius: 6px; padding: 0.4rem 0.8rem; cursor: pointer; font-size: 0.85rem; }
    .filter-tag.active { background: #4a90e2; color: white; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; padding: 2rem; max-width: 1200px; margin: 0 auto; }
    .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 1.5rem; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
    .card h2 { margin: 0.5rem 0; font-size: 1.2rem; }
    .card p { font-size: 0.95rem; color: #555; }
    .card .tag { font-size: 0.75rem; color: #fff; background: #4a90e2; display: inline-block; padding: 0.25rem 0.5rem; border-radius: 6px; margin: 0.5rem 0; }
    .card a { display: inline-block; background: #ffc107; color: #000; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: bold; margin-top: 0.5rem; }
    footer { position: fixed; bottom: 0; left: 0; right: 0; background: #4a90e2; display: flex; justify-content: center; gap: 2rem; padding: 0.75rem 0; z-index: 1000; }
    footer button { background: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: bold; cursor: pointer; }
    #homeView, #databaseView { display: none; }
    #homeView.active, #databaseView.active { display: block; }
    table { width: 95%; margin: 2rem auto; border-collapse: collapse; table-layout: fixed; }
    th, td { padding: 0.6rem; border: 1px solid #ccc; text-align: left; }
    th:nth-child(1), td:nth-child(1) { width: 16%; }
    th:nth-child(2), td:nth-child(2) { width: 18%; }
    th:nth-child(3), td:nth-child(3) { width: 24%; }
    th:nth-child(4), td:nth-child(4) { width: 15%; }
    th:nth-child(5), td:nth-child(5) { width: 10%; }
    th:nth-child(6), td:nth-child(6) { width: 7%; }
    th:nth-child(7), td:nth-child(7) { width: 10%; text-align: center; }
    .btn-bar { margin: 1rem 2rem; text-align: center; }
    .btn-bar button, .btn-bar select { margin: 0.5rem; padding: 0.5rem 1rem; border-radius: 6px; font-weight: bold; }
    #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #4caf50; color: white; padding: 1rem 2rem; border-radius: 8px; font-weight: bold; box-shadow: 0 4px 8px rgba(0,0,0,0.2); opacity: 0; transition: opacity 0.5s ease-in-out; z-index: 2000; }
    #toast.show { opacity: 1; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>
<header>
  <div class="header-left">
    <img src="https://springschool.me/wp-content/uploads/2020/12/SPRING-SCHOOL-LOGO-01.png" alt="Logo"/>
    <div class="header-title">
      <h1>S.T.A.G.E</h1>
      <div class="subtitle">Spring Platform for Resources, Ideas, Notes and Tools</div>
    </div>
  </div>
  <button class="login-btn" onclick="handleLogin()">Login</button>
</header>

<main id="homeView" class="active">
  <div id="tagFilters"></div>
  <div class="grid" id="homeGrid"></div>
</main>

<main id="databaseView">
  <div class="btn-bar">
    <button onclick="addRow()">➕ Add Game</button>
    <button onclick="saveToFirebase()">💾 Save All</button>
    <select onchange="sortGames(this.value)">
      <option value="">Ordenar por...</option>
      <option value="nome">Nome</option>
      <option value="tags">Tags</option>
    </select>
  </div>
  <table id="gameTable">
    <tr>
      <th>Nome</th>
      <th>Link</th>
      <th>Descrição</th>
      <th>Tags</th>
      <th>Tipo</th>
      <th>Arquivo</th>
      <th>Ações</th>
    </tr>
  </table>
</main>

<footer>
  <button onclick="switchView('home')">🏠 Home</button>
  <button onclick="switchView('database')">📁 Banco de Dados</button>
</footer>

<div id="toast">💾 Jogos salvos com sucesso!</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const firebaseConfig = {
    apiKey: "AIzaSyD2trlGj_o_0ZXnJekL6NlZP7rS-bZdWVY",
    authDomain: "sprint-byleo.firebaseapp.com",
    projectId: "sprint-byleo",
    storageBucket: "sprint-byleo.appspot.com",
    messagingSenderId: "306149887616",
    appId: "1:306149887616:web:5a3d7efbb718121fe3e065"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

  auth.onAuthStateChanged(user => {
    if (user) {
      document.querySelector('.login-btn').textContent = user.displayName;
      document.querySelector('.login-btn').disabled = true;
      loadFromFirebase();
    }
  });

  window.handleLogin = function () {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider)
      .then(result => {
        document.querySelector('.login-btn').textContent = result.user.displayName;
        document.querySelector('.login-btn').disabled = true;
        loadFromFirebase();
      })
      .catch(error => console.error('Erro no login:', error));
  };

  window.switchView = function(view) {
    document.getElementById('homeView').classList.remove('active');
    document.getElementById('databaseView').classList.remove('active');
    document.getElementById(view + 'View').classList.add('active');
  };

  window.addRow = function () {
    renderRow({ nome: '', link: '', descricao: '', tags: '', tipo: '' });
  };

  window.saveToFirebase = function () {
    const rows = document.querySelectorAll('#gameTable tr');
    const batch = db.batch();
    rows.forEach((row, index) => {
      if (index === 0) return;
      const inputs = row.querySelectorAll('input[type=text]');
      const data = {
        nome: inputs[0].value,
        link: inputs[1].value,
        descricao: inputs[2].value,
        tags: inputs[3].value,
        tipo: inputs[4].value
      };
      const ref = db.collection('games').doc();
      batch.set(ref, data);
    });
    batch.commit().then(() => {
      showToast('💾 Jogos salvos com sucesso!');
      loadFromFirebase(); // ✅ RELOAD após salvar
    });
  };

  window.loadFromFirebase = function () {
    db.collection('games').get().then(snapshot => {
      allGames = snapshot.docs.map(doc => doc.data());
      renderAll();
    });
  };

  function renderAll() {
    document.getElementById('homeGrid').innerHTML = '';
    document.getElementById('gameTable').innerHTML = document.querySelector('#gameTable').rows[0].outerHTML;
    allGames.forEach(g => {
      renderCard(g);
      renderRow(g);
    });
    renderTagFilters();
  }

  function renderCard(g) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h2>${g.nome}</h2><p>${g.descricao}</p><div class="tag">${g.tags}</div><a href="${g.link}" target="_blank">Jogar</a>`;
    document.getElementById('homeGrid').appendChild(card);
  }

  function renderRow(g) {
    const table = document.getElementById('gameTable');
    const row = table.insertRow();
    ['nome','link','descricao','tags','tipo'].forEach(k => {
      const cell = row.insertCell();
      const input = document.createElement('input');
      input.type = 'text';
      input.value = g[k] || '';
      cell.appendChild(input);
    });
    const uploadCell = row.insertCell();
    uploadCell.appendChild(document.createElement('input')).type = 'file';
    const actionsCell = row.insertCell();
    const delBtn = document.createElement('button');
    delBtn.textContent = '🗑️';
    delBtn.onclick = () => row.remove();
    actionsCell.appendChild(delBtn);
  }

  function renderTagFilters() {
    const set = new Set();
    allGames.forEach(g => g.tags?.split(',').forEach(t => set.add(t.trim())));
    const container = document.getElementById('tagFilters');
    container.innerHTML = '';
    [...set].sort().forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'filter-tag';
      btn.textContent = tag;
      btn.onclick = () => toggleTag(btn, tag);
      container.appendChild(btn);
    });
  }

  function toggleTag(btn, tag) {
    btn.classList.toggle('active');
    selectedTags.includes(tag)
      ? selectedTags.splice(selectedTags.indexOf(tag), 1)
      : selectedTags.push(tag);
    filterCards();
  }

  function filterCards() {
    const filtered = selectedTags.length === 0
      ? allGames
      : allGames.filter(g => selectedTags.some(tag => g.tags?.includes(tag)));
    document.getElementById('homeGrid').innerHTML = '';
    filtered.forEach(renderCard);
  }

  window.sortGames = function (key) {
    if (!key) return;
    allGames.sort((a, b) => (a[key] || '').localeCompare(b[key] || ''));
    renderAll();
  };

  window.showToast = function (msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  };

  let allGames = [];
  let selectedTags = [];
});
</script>
</body>
</html>
