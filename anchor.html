<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>S.T.A.G.E</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5faff; margin: 0; padding: 0 0 60px 0; }
    header { background: #4a90e2; color: white; padding: 1rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .header-left { display: flex; align-items: center; gap: 1rem; }
    header img { height: 50px; }
    .header-title { display: flex; flex-direction: column; }
    h1 { font-size: 2rem; margin: 0; }
    .subtitle { font-size: 0.9rem; font-style: italic; margin-top: 0.2rem; }
    .login-btn { background: white; color: #4a90e2; font-weight: bold; padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; border: none; }
    #tagFilters { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 1rem 2rem 0; }
    .filter-tag { background: #e0e0e0; border: none; border-radius: 6px; padding: 0.4rem 0.8rem; cursor: pointer; font-size: 0.85rem; }
    .filter-tag.active { background: #4a90e2; color: white; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; padding: 2rem; max-width: 1200px; margin: 0 auto; }
    .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 1.5rem; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
    .card h2 { margin: 0.5rem 0; font-size: 1.2rem; }
    .card p { font-size: 0.95rem; color: #555; }
    .tag-container { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; margin-top: 0.5rem; }
    .tag { font-size: 0.75rem; color: #fff; background: #4a90e2; padding: 0.25rem 0.5rem; border-radius: 6px; }
    .card a { display: inline-block; background: #ffc107; color: #000; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: bold; margin-top: 0.5rem; }
    footer { position: fixed; bottom: 0; left: 0; right: 0; background: #4a90e2; display: flex; justify-content: center; gap: 2rem; padding: 0.75rem 0; z-index: 1000; }
    footer button { background: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: bold; cursor: pointer; }
    #homeView, #addNewView { display: none; }
    #homeView.active, #addNewView.active { display: block; }
    #editArea {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 2rem;
      padding: 2rem 0;
      max-width: 1200px;
      margin: 0 auto;
    }
    .edit-card, .middle-card, .preview-card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.09);
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      min-width: 220px;
      max-width: 330px;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .edit-card input[type="text"], .edit-card textarea,
    .middle-card textarea, .middle-card input[type="text"] {
      width: 100%;
      font-size: 1rem;
      border-radius: 7px;
      border: 1px solid #c9c9c9;
      padding: 0.7rem;
      margin-bottom: 0.2rem;
      box-sizing: border-box;
    }
    .edit-card textarea, .middle-card textarea {
      min-height: 60px;
      max-width: 100%;
      resize: vertical;
    }
    .middle-card {
      background: #f8fafd;
      min-width: 180px;
      max-width: 210px;
      min-height: 180px;
      align-items: stretch;
      justify-content: flex-start;
      gap: 1rem;
      box-shadow: 0 2px 8px #0001;
      padding: 1.2rem 1rem;
    }
    .btn-actions {
      display: flex;
      gap: 1.1rem;
      margin-top: 1.3rem;
      justify-content: flex-end;
    }
    .btn-actions button {
      padding: 0.5rem 1.3rem;
      font-size: 1.02rem;
      border-radius: 7px;
      font-weight: bold;
      border: none;
      background: #4a90e2;
      color: #fff;
      cursor: pointer;
      transition: background 0.12s;
    }
    .btn-actions button:active { background: #306699; }
    .preview-card {
      align-items: center;
      justify-content: flex-start;
      text-align: center;
    }
    .preview-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 0.3rem;
      color: #222;
    }
    .preview-desc {
      font-size: 1.01rem;
      color: #444;
      margin-bottom: 0.6rem;
      min-height: 52px;
    }
    .preview-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      justify-content: center;
      margin-bottom: 0.7rem;
    }
    .preview-tag {
      background: #4a90e2;
      color: #fff;
      border-radius: 6px;
      font-size: 0.85rem;
      padding: 0.22rem 0.7rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .preview-moreinfo {
      display: none;
      background: #e0e7ef;
      color: #2a4062;
      border: none;
      padding: 0.48rem 1rem;
      border-radius: 7px;
      font-weight: bold;
      margin-bottom: 0.7rem;
      box-shadow: 0 1px 4px #0002;
      font-size: 0.97rem;
      cursor: pointer;
      transition: background 0.13s;
    }
    .preview-link {
      display: inline-block;
      background: #ffc107;
      color: #000;
      text-decoration: none;
      padding: 0.7rem 2rem;
      border-radius: 7px;
      font-weight: bold;
      margin-top: 0.6rem;
      font-size: 1.08rem;
      transition: box-shadow .1s;
      box-shadow: 0 2px 6px #0001;
    }
    .preview-link:active { box-shadow: none; }
    #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #4caf50; color: white; padding: 1rem 2rem; border-radius: 8px; font-weight: bold; box-shadow: 0 4px 8px rgba(0,0,0,0.2); opacity: 0; transition: opacity 0.5s; z-index: 2000; }
    #toast.show { display: block; opacity: 1; }
    @media (max-width: 1100px) {
      #editArea { flex-direction: column; align-items: stretch; }
      .edit-card, .middle-card, .preview-card { max-width: 100%; min-width: unset; }
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>
<header>
  <div class="header-left">
    <img src="https://springschool.me/wp-content/uploads/2020/12/SPRING-SCHOOL-LOGO-01.png" alt="Spring School Logo"/>
    <div class="header-title">
      <h1>S.T.A.G.E</h1>
      <div class="subtitle">Spring Teacher's Activity & Guidance Engine</div>
    </div>
  </div>
  <button class="login-btn" onclick="handleLogin()">Login</button>
</header>

<main id="homeView" class="active">
  <div id="tagFilters"></div>
  <div class="grid" id="homeGrid"></div>
</main>

<main id="addNewView">
  <div id="editArea"></div>
</main>

<footer>
  <button onclick="switchView('home')">🏠 Home</button>
  <button onclick="switchView('addNew')">➕ Add New</button>
</footer>
<div id="toast">💾 Jogos salvos com sucesso!</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAsYg7ZTHXD_a6d_icFLw9e5y0jSTfXBi0",
    authDomain: "spring-stage-by-leo.firebaseapp.com",
    projectId: "spring-stage-by-leo",
    storageBucket: "spring-stage-by-leo.firebasestorage.app",
    messagingSenderId: "215839443924",
    appId: "1:215839443924:web:16a9fae4a0a5da76f16441",
    measurementId: "G-JEE5SLV9YP"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let allGames = [];
  let selectedTags = [];
  let userLogged = false;

  auth.onAuthStateChanged(user => {
    if (user) {
      document.querySelector('.login-btn').textContent = user.displayName;
      document.querySelector('.login-btn').disabled = true;
      userLogged = true;
      loadFromFirebase();
    }
  });

  function handleLogin() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider)
      .then(result => {
        document.querySelector('.login-btn').textContent = result.user.displayName;
        document.querySelector('.login-btn').disabled = true;
        userLogged = true;
        loadFromFirebase();
      })
      .catch(error => console.error('Erro no login:', error));
  }

  function switchView(view) {
    if (view === 'addNew' && !userLogged) {
      showToast("⚠️ Faça login para acessar o cadastro.");
      return;
    }
    document.getElementById('homeView').classList.remove('active');
    document.getElementById('addNewView').classList.remove('active');
    document.getElementById(view + 'View').classList.add('active');
    if(view === 'addNew') showEditCard();
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  // ----------- EDIT MODE: 3 COLUNAS -----------
  function showEditCard() {
    const editArea = document.getElementById('editArea');
    editArea.innerHTML = '';

    // Bloco de edição à esquerda
    const editCard = document.createElement('div');
    editCard.className = 'edit-card';
    editCard.innerHTML = `
      <input type="text" class="input-nome" placeholder="Game Name">
      <textarea class="input-desc" placeholder="Description" rows="4"></textarea>
      <input type="text" class="input-tags" placeholder="Tags (comma-separated)">
      <input type="text" class="input-link" placeholder="URL">
      <div class="btn-actions">
        <button type="button" onclick="addGame(this)">Add</button>
      </div>
    `;

    // Bloco do meio: more info + button text
    const middleCard = document.createElement('div');
    middleCard.className = 'middle-card';
    middleCard.innerHTML = `
      <textarea class="input-moreinfo" placeholder="More info (opcional)"></textarea>
      <input type="text" class="input-btntext" placeholder="Button text (Play, Download, Watch...)">
    `;

    // Bloco de preview à direita
    const previewCard = document.createElement('div');
    previewCard.className = 'preview-card';
    previewCard.innerHTML = `
      <div class="preview-title">Game Name</div>
      <div class="preview-desc">Description</div>
      <div class="preview-tags"></div>
      <button class="preview-moreinfo" style="display:none; margin-bottom:0.7rem;"></button>
      <a class="preview-link" href="#" target="_blank">Play</a>
    `;

    // Sincroniza preview dinâmico
    editCard.querySelector('.input-nome').addEventListener('input', e => {
      previewCard.querySelector('.preview-title').textContent = e.target.value || 'Game Name';
    });
    editCard.querySelector('.input-desc').addEventListener('input', e => {
      previewCard.querySelector('.preview-desc').textContent = e.target.value || 'Description';
    });
    editCard.querySelector('.input-tags').addEventListener('input', e => {
      const val = e.target.value;
      const arr = val.split(',').map(t=>t.trim()).filter(Boolean);
      previewCard.querySelector('.preview-tags').innerHTML = arr.map(tag=>`<span class="preview-tag">${tag}</span>`).join('');
    });
    editCard.querySelector('.input-link').addEventListener('input', e => {
      const val = e.target.value;
      const a = previewCard.querySelector('.preview-link');
      a.href = val || '#';
      // Só usa getLabelForLink se o campo button text do meio estiver vazio!
      const btnText = middleCard.querySelector('.input-btntext').value;
      a.textContent = btnText || getLabelForLink(val);
    });
    // Middle card: More info
    middleCard.querySelector('.input-moreinfo').addEventListener('input', e => {
      const val = e.target.value.trim();
      const btn = previewCard.querySelector('.preview-moreinfo');
      if(val) {
        btn.textContent = val;
        btn.style.display = '';
      } else {
        btn.style.display = 'none';
      }
    });
    // Middle card: Button text
    middleCard.querySelector('.input-btntext').addEventListener('input', e => {
      const val = e.target.value;
      const a = previewCard.querySelector('.preview-link');
      const urlVal = editCard.querySelector('.input-link').value;
      a.textContent = val || getLabelForLink(urlVal);
    });

    // Container: agora 3 colunas
    const container = document.createElement('div');
    container.style.display = 'flex';
    container.style.gap = '2rem';
    container.appendChild(editCard);
    container.appendChild(middleCard);
    container.appendChild(previewCard);

    // Adiciona ao editArea
    editArea.appendChild(container);
  }

  function getLabelForLink(link) {
    if (!link) return 'Play';
    return /\.(pdf|zip|docx?|xlsx?|pptx?|mp3|mp4)$/i.test(link) ? 'Download' : 'Play';
  }

  // Botão Add: salva no Firebase e limpa os campos!
  function addGame(btn) {
    const editArea = document.getElementById('editArea');
    const editCard = editArea.querySelector('.edit-card');
    const middleCard = editArea.querySelector('.middle-card');
    const nome = editCard.querySelector('.input-nome').value.trim();
    const descricao = editCard.querySelector('.input-desc').value.trim();
    const tags = editCard.querySelector('.input-tags').value.trim();
    const link = editCard.querySelector('.input-link').value.trim();
    const moreinfo = middleCard.querySelector('.input-moreinfo').value.trim();
    const buttonText = middleCard.querySelector('.input-btntext').value.trim();

    if (!nome || !link) {
      showToast('⚠️ Preencha nome e link!');
      return;
    }
    db.collection('games').doc().set({nome, descricao, tags, link, moreinfo, buttonText})
      .then(() => {
        showToast('✅ Jogo adicionado com sucesso!');
        // Limpa todos os campos do card editável e do meio
        editCard.querySelector('.input-nome').value = '';
        editCard.querySelector('.input-desc').value = '';
        editCard.querySelector('.input-tags').value = '';
        editCard.querySelector('.input-link').value = '';
        middleCard.querySelector('.input-moreinfo').value = '';
        middleCard.querySelector('.input-btntext').value = '';
        // Limpa preview também
        const previewCard = editArea.querySelector('.preview-card');
        previewCard.querySelector('.preview-title').textContent = 'Game Name';
        previewCard.querySelector('.preview-desc').textContent = 'Description';
        previewCard.querySelector('.preview-tags').innerHTML = '';
        previewCard.querySelector('.preview-moreinfo').style.display = 'none';
        previewCard.querySelector('.preview-link').href = '#';
        previewCard.querySelector('.preview-link').textContent = 'Play';
        loadFromFirebase(); // atualiza home
      });
  }

  // ---- RESTANTE DA HOME E TAGS (alteração nas tags para preservar capitalização) ----
  function renderCard(g) {
    const card = document.createElement('div');
    card.className = 'card';
    const isArquivo = g.link && /\.(pdf|zip|docx?|xlsx?|pptx?|mp3|mp4)$/i.test(g.link);
    // Botão principal: usa texto customizado se houver
    const label = g.buttonText && g.buttonText.trim() ? g.buttonText : (isArquivo ? 'Download' : 'Play');
    const a = document.createElement('a');
    a.href = g.link;
    a.textContent = label;
    a.target = '_blank';
    if (isArquivo) a.setAttribute('download', '');

    // Tags preservando maiúsculas/minúsculas
    let tagsArray;
    if (Array.isArray(g.tags)) tagsArray = g.tags;
    else if (typeof g.tags === "string") tagsArray = g.tags.split(',').map(t => t.trim()).filter(Boolean);
    else tagsArray = [];

    const tagContainer = document.createElement('div');
    tagContainer.className = 'tag-container';
    tagsArray.forEach(tag => {
      const tagDiv = document.createElement('div');
      tagDiv.className = 'tag';
      tagDiv.textContent = tag;
      tagContainer.appendChild(tagDiv);
    });

    card.innerHTML = `
      <h2>${g.nome}</h2>
      <p>${g.descricao}</p>
    `;
    card.appendChild(tagContainer);

    // More info button se houver
    if(g.moreinfo && g.moreinfo.trim()) {
      const infoBtn = document.createElement('button');
      infoBtn.className = 'preview-moreinfo';
      infoBtn.textContent = g.moreinfo;
      infoBtn.style.display = '';
      infoBtn.style.marginBottom = '0.7rem';
      infoBtn.onclick = () => alert(g.moreinfo); // popup simples, pode personalizar!
      card.appendChild(infoBtn);
    }

    card.appendChild(a);
    document.getElementById('homeGrid').appendChild(card);
  }

  function renderTagFilters() {
    const container = document.getElementById('tagFilters');
    container.innerHTML = '';
    // Preserva capitalização, mas não repete tags insensíveis a case
    let tagsRaw = [];
    allGames.forEach(g => {
      let arr;
      if (Array.isArray(g.tags)) arr = g.tags;
      else if (typeof g.tags === "string") arr = g.tags.split(',').map(t => t.trim()).filter(Boolean);
      else arr = [];
      tagsRaw = tagsRaw.concat(arr);
    });
    // Agrupa mantendo a primeira capitalização digitada
    let tagsDict = {};
    tagsRaw.forEach(t => {
      const lower = t.toLowerCase();
      if (!tagsDict[lower]) tagsDict[lower] = t;
    });
    const tags = Object.values(tagsDict);

    tags.forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'filter-tag';
      btn.textContent = tag;
      btn.onclick = () => toggleTag(tag, btn);
      container.appendChild(btn);
    });
  }

  function toggleTag(tag, button) {
    button.classList.toggle('active');
    // Busca insensível a maiúsculas/minúsculas
    const tagLower = tag.toLowerCase();
    if (selectedTags.map(t => t.toLowerCase()).includes(tagLower)) {
      selectedTags = selectedTags.filter(t => t.toLowerCase() !== tagLower);
    } else {
      selectedTags.push(tag);
    }
    filterCards();
  }

  function filterCards() {
    const filtered = selectedTags.length === 0
      ? allGames
      : allGames.filter(g => {
          let tagsArray;
          if (Array.isArray(g.tags)) tagsArray = g.tags;
          else if (typeof g.tags === "string") tagsArray = g.tags.split(',').map(t => t.trim()).filter(Boolean);
          else tagsArray = [];
          // busca insensível a case!
          const tagsLower = tagsArray.map(t => t.toLowerCase());
          return selectedTags.every(tag => tagsLower.includes(tag.toLowerCase()));
        });
    document.getElementById('homeGrid').innerHTML = '';
    filtered.forEach(renderCard);
  }

  function loadFromFirebase() {
    db.collection("games").get().then(snapshot => {
      allGames = snapshot.docs.map(doc => doc.data());
      document.getElementById('homeGrid').innerHTML = '';
      allGames.forEach(renderCard);
      renderTagFilters();
    });
  }
</script>
</body>
</html>
