
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spring Wordle - Final</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #333;
      height: 100vh;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .logo { height: 80px; }
    .tab {
      display: none;
      height: calc(100vh - 130px);
      overflow: auto;
      padding: 1rem;
    }
    .tab.active { display: block; }
    .menu-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 2rem;
    }
    .menu-buttons button {
      border: none;
      border-radius: 1rem;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      background-color: #e74c3c;
      color: white;
      cursor: pointer;
    }
    .menu-buttons button.secondary {
      background-color: #3498db;
    }
    .fixed-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #222;
      padding: 0.5rem;
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      align-items: center;
      z-index: 10;
    }
    .fixed-bar input {
      font-size: 1.2rem;
      padding: 0.5rem;
      width: 300px;
      border-radius: 0.5rem;
    }
    .fixed-bar button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      border: none;
      border-radius: 0.5rem;
      background: #3498db;
      color: white;
      cursor: pointer;
    }
    #toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 1rem;
      border-radius: 0.5rem;
      font-size: 1.1rem;
      max-width: 80vw;
      text-align: center;
      display: none;
      z-index: 100;
    }
    #toast button {
      background: transparent;
      border: none;
      color: white;
      font-size: 1.2rem;
      margin-left: 1rem;
      cursor: pointer;
    }
    .guess-row {
  display: flex;
  justify-content: center;
  gap: 4px;
  margin: 0.25rem auto;




  margin: 0.25rem auto;

      display: grid;
      justify-content: center;
      grid-template-columns: repeat(var(--box-count), minmax(40px, 1fr));
      gap: 0.5rem;
      width: 100%;
      max-width: 90vw;
      margin: 0.25rem auto;
    }
    .letter-box {
  transition: transform 0.2s ease, background-color 0.3s ease;

  width: calc((90vw - (var(--gap, 0.5rem) * (var(--box-count) - 1))) / var(--box-count));
  max-width: 60px;
  aspect-ratio: 1;
  font-size: clamp(1.2rem, 2.5vw, 2rem);
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ddd;
  border-radius: 0.5rem;
  text-transform: uppercase;
}
    .correct {
  background: #2ecc71 !important;
  animation: pop 0.2s ease;
}
    .present {
  background: #f1c40f !important;
  animation: pop 0.2s ease;
}
    .absent {
  background: #95a5a6 !important;
  animation: shake 0.3s ease;
}
    h2 {
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 1rem;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
  
@keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}
@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-3px); }
  50% { transform: translateX(3px); }
  75% { transform: translateX(-2px); }
  100% { transform: translateX(0); }
}

#board {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.25rem;
}

.guess-row {
  display: flex;
  justify-content: center;
  width: 100%;
  max-width: 400px;
  gap: 4px;
}
</style>


</head>
<body>

<header>
  <img src="https://springschool.me/wp-content/uploads/2020/12/SPRING-SCHOOL-LOGO-01.png" alt="Logo" class="logo">
</header>

<div id="homeTab" class="tab active">
  <h2>How Many Letters?</h2>
  <div class="menu-buttons">
    <button onclick="startGame(3)">3</button>
    <button onclick="startGame(4)">4</button>
    <button onclick="startGame(5)">5</button>
    <button onclick="startGame(6)">6</button>
  </div>
  <div class="menu-buttons">
    <button class="secondary" onclick="showTab('wordsTab')">✍️ Edit Words</button>
    <button class="secondary" onclick="showInstructions()">❓ How to Play</button>
  </div>
</div>

<div id="gameTab" class="tab">
  <h2>Guess the Word!</h2>
  <div id="board" class="board"></div>
  <p id="result" style="text-align:center;"></p>
</div>

<div id="wordsTab" class="tab">
  <h2>Edit Word Lists</h2>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
    <div><label>3-letter words:</label><br><textarea id="words3"></textarea></div>
    <div><label>4-letter words:</label><br><textarea id="words4"></textarea></div>
    <div><label>5-letter words:</label><br><textarea id="words5"></textarea></div>
    <div><label>6-letter words:</label><br><textarea id="words6"></textarea></div>
  </div>
  <button onclick="saveWords()">Save</button>
</div>

<div class="fixed-bar">
  <button onclick="showTab('homeTab')">🏠</button>
  <input type="text" id="guessInput" placeholder="Type your guess" onkeydown="if(event.key==='Enter'){checkGuess()}">
  <button onclick="checkGuess()">Try</button>
  <button onclick="toggleFullScreen()">🖥️</button>
  <button onclick="showHint()">🧩</button>
</div>

<div id="toast"></div>

<script>
let wordLists = {
  3: ['sun:star-hot-day','dog:pet-bark-loyal','hat:head-wear-style'],
  4: ['book:read-pages-cover','frog:animal-jump-green','milk:drink-white-cow'],
  5: ['apple:fruit-red-crunchy','chair:sit-furniture-legs','plant:green-grow-pot'],
  6: ['planet:space-earth-mars','window:glass-look-outside','school:learn-students-teachers']
};

let currentLength = 5;
let solution = '';
let solutionHints = [];
let hintIndex = 0;
let guesses = [];
const maxGuesses = 6;

document.addEventListener('DOMContentLoaded', () => {
  [3,4,5,6].forEach(len => {
    const area = document.getElementById(`words${len}`);
    if (area && wordLists[len]) {
      area.value = wordLists[len].join(', ');
    }
  });
});

function showTab(tabId) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
}

function showToast(msg, stay=false) {
  const toast = document.getElementById('toast');
  toast.innerHTML = stay ? `${msg} <button onclick="this.parentElement.style.display='none'">❌</button>` : msg;
  toast.style.display = 'block';
  if (!stay) setTimeout(() => toast.style.display = 'none', 3000);
}

function drawEmptyRows() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  for (let i = 0; i < maxGuesses; i++) {
    const row = document.createElement('div');
    row.className = 'guess-row';
    row.style.setProperty('--box-count', currentLength);
    row.style.setProperty('--box-count', currentLength);
    row.style.setProperty('--gap', '0.5rem');
    row.style.setProperty('--box-count', currentLength);
    for (let j = 0; j < currentLength; j++) {
      const box = document.createElement('div');
      box.className = 'letter-box';
      box.textContent = "";
      row.appendChild(box);
    }
    board.appendChild(row);
  }
}

function startGame(length) {
  currentLength = length;
  const list = wordLists[length];
  if (!list || list.length === 0) {
    showToast('No words available for this length.', true);
    return;
  }
  const pick = list[Math.floor(Math.random() * list.length)];
  const parts = pick.split(':');
  solution = parts[0];
  solutionHints = parts[1]?.split('-') || [];
  hintIndex = 0;
  guesses = [];
  drawEmptyRows();
  document.getElementById('result').textContent = '';
  document.getElementById('guessInput').value = '';
  showTab('gameTab');
  showToast('Game Started!');
}

function checkGuess() {
  const guess = document.getElementById('guessInput').value.trim().toLowerCase();
  if (guess.length !== currentLength) {
    showToast(`Enter a ${currentLength}-letter word.`);
    return;
  }
  if (guesses.length >= maxGuesses) return;

  guesses.push(guess);
  const row = document.getElementById('board').children[guesses.length - 1];
  [...guess].forEach((char, i) => {
    const box = row.children[i];
    box.textContent = char;
    box.classList.remove('correct', 'present', 'absent');
    if (solution[i] === char) {
      box.classList.add('correct');
    } else if (solution.includes(char)) {
      box.classList.add('present');
    } else {
      box.classList.add('absent');
    }
  });

  if (guess === solution) {
    showToast('🎉 Correct!', true);
    document.getElementById('result').innerHTML = '<button onclick="startGame(currentLength)">Play Again</button>';
    return;
  }
  if (guesses.length === maxGuesses) {
    showToast(`❌ The word was: ${solution}`, true);
    document.getElementById('result').innerHTML = '<button onclick="startGame(currentLength)">Play Again</button>';
  }
  document.getElementById('guessInput').value = '';
}

function saveWords() {
  [3,4,5,6].forEach(len => {
    const text = document.getElementById(`words${len}`).value;
    wordLists[len] = text.split(',').map(w => w.trim().toLowerCase()).filter(w => w.includes(':'));
  });
  showToast("Words saved!");
}

function showInstructions() {
  showToast("Guess the word in several tries. Use hints if needed.", true);
}

function showHint() {
  if (hintIndex < solutionHints.length) {
    showToast(`Hint: ${solutionHints[hintIndex++]}`, true);
  } else {
    showToast("No more hints.", true);
  }
}

function toggleFullScreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}
</script>

</body>
</html>
