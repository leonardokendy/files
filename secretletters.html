<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spring Wordle - Final</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #333;
      height: 100vh;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .logo { height: 80px; }
    .tab {
      display: none;
      height: calc(100vh - 130px);
      overflow: auto;
      padding: 1rem;
    }
    .tab.active { display: block; }
    .menu-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 2rem;
    }
    .menu-buttons button {
      border: none;
      border-radius: 1rem;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      background-color: #e74c3c;
      color: white;
      cursor: pointer;
    }
    .menu-buttons button.secondary {
      background-color: #3498db;
    }
    .fixed-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #222;
      padding: 0.5rem;
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      align-items: center;
      z-index: 10;
    }
    .fixed-bar input {
      font-size: 1.2rem;
      padding: 0.5rem;
      width: 300px;
      border-radius: 0.5rem;
    }
    .fixed-bar button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      border: none;
      border-radius: 0.5rem;
      background: #3498db;
      color: white;
      cursor: pointer;
    }
    #toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 1rem;
      border-radius: 0.5rem;
      font-size: 1.1rem;
      max-width: 80vw;
      text-align: center;
      display: none;
      z-index: 100;
    }
    #toast button {
      background: transparent;
      border: none;
      color: white;
      font-size: 1.2rem;
      margin-left: 1rem;
      cursor: pointer;
    }
    .guess-row {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin: 0.25rem auto;
      display: grid;
      justify-content: center;
      grid-template-columns: repeat(var(--box-count), minmax(40px, 1fr));
      gap: 0.5rem;
      width: 100%;
      max-width: 90vw;
      margin: 0.25rem auto;
    }
    .letter-box {
      transition: transform 0.2s ease, background-color 0.3s ease;
      width: calc((90vw - (var(--gap, 0.5rem) * (var(--box-count) - 1))) / var(--box-count));
      max-width: 60px;
      aspect-ratio: 1;
      font-size: clamp(1.2rem, 2.5vw, 2rem);
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ddd;
      border-radius: 0.5rem;
      text-transform: uppercase;
    }
    .correct {
      background: #2ecc71 !important;
      animation: pop 0.2s ease;
    }
    .present {
      background: #f1c40f !important;
      animation: pop 0.2s ease;
    }
    .absent {
      background: #95a5a6 !important;
      animation: shake 0.3s ease;
    }
    h2 {
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 1rem;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      50% { transform: translateX(3px); }
      75% { transform: translateX(-2px); }
      100% { transform: translateX(0); }
    }
    #board {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
    }
    .guess-row {
      display: flex;
      justify-content: center;
      width: 100%;
      max-width: 400px;
      gap: 4px;
    }
    table#editWordsTable th, table#editWordsTable td {
      border: 1px solid #ccc;
    }
    table#editWordsTable th {
      background: #3498db;
      color: white;
      font-weight: bold;
    }
    table#editWordsTable input {
      border: none;
      background: transparent;
      font-size: 1rem;
    }
    table#editWordsTable tr:nth-child(even) {
      background: #f7f7fa;
    }
    table#editWordsTable tr:hover {
      background: #eef6fa;
    }
  </style>
</head>
<body>

<header>
  <img src="https://springschool.me/wp-content/uploads/2020/12/SPRING-SCHOOL-LOGO-01.png" alt="Logo" class="logo">
</header>

<div id="homeTab" class="tab active">
  <h2>How Many Letters?</h2>
  <div class="menu-buttons">
    <button onclick="startGame(3)">3</button>
    <button onclick="startGame(4)">4</button>
    <button onclick="startGame(5)">5</button>
    <button onclick="startGame(6)">6</button>
  </div>
</div>

<div id="gameTab" class="tab">
  <h2>Guess the Word!</h2>
  <div id="board" class="board"></div>
  <p id="result" style="text-align:center;"></p>
</div>

<!-- Improved Table-based Edit Words Tab: -->
<div id="wordsTab" class="tab">
  <h2>Edit Word Lists</h2>
  <div style="display: flex; gap: 1.5rem; align-items: center; margin: 1.5rem 0;">
    <button id="prevWordList" style="font-size: 2rem; padding: 1rem 1.5rem; border-radius: 2rem; border: none; background: #e74c3c; color: white; cursor: pointer;">←</button>
    <span id="wordListLabel" style="font-size: 1.5rem; font-weight: bold;"></span>
    <button id="nextWordList" style="font-size: 2rem; padding: 1rem 1.5rem; border-radius: 2rem; border: none; background: #e74c3c; color: white; cursor: pointer;">→</button>
  </div>
  <div style="overflow-x: auto; width: 100%; max-width: 700px; margin: 0 auto;">
    <table id="editWordsTable" style="width: 100%; border-collapse: collapse; margin-bottom: 1rem;">
      <thead>
        <tr>
          <th style="padding: 0.5rem;">Word</th>
          <th style="padding: 0.5rem;">Hint 1</th>
          <th style="padding: 0.5rem;">Hint 2</th>
          <th style="padding: 0.5rem;">Hint 3</th>
          <th style="padding: 0.5rem;">Delete</th>
        </tr>
      </thead>
      <tbody>
        <!-- rows inserted by JS -->
      </tbody>
    </table>
  </div>
  <div style="display: flex; gap: 1rem; justify-content: center; margin-bottom: 1.5rem;">
    <button onclick="addWordRow()" style="font-size: 1.1rem; padding: 0.6rem 1.3rem; border-radius: 1.5rem; border: none; background: #2ecc71; color: white; cursor: pointer;">+ Add Word</button>
    <button onclick="saveTableWordList()" style="font-size: 1.1rem; padding: 0.6rem 2rem; border-radius: 1.5rem; border: none; background: #3498db; color: white; cursor: pointer;">Save</button>
  </div>
</div>

<div class="fixed-bar">
  <button onclick="showTab('homeTab')" title="Home">🏠</button>
  <input type="text" id="guessInput" placeholder="Type your guess" onkeydown="if(event.key==='Enter'){checkGuess()}">
  <button onclick="checkGuess()">Try</button>
  <button onclick="showTab('wordsTab')" title="Edit Words">✍️</button>
  <button onclick="showInstructions()" title="How to Play">❓</button>
  <button onclick="toggleFullScreen()" title="Full Screen">🖥️</button>
  <button onclick="showHint()" title="Hint">🧩</button>
</div>

<div id="toast"></div>

<script>
// --- NEW Default word lists with 3 short hints per word ---
let wordLists = {
  3: [
    'sun:This shines in the sky.-It is very hot.-It comes out in the day.',
    'dog:This animal barks.-It is a common pet.-It loves to play fetch.',
    'hat:You wear this on your head.-It protects from sun or rain.-Some are for fashion.',
    'cat:This animal likes to chase mice.-It purrs.-It can climb trees.',
    'car:You drive this on the road.-It has four wheels.-It moves fast.',
    'run:This is when you move very fast.-It is good exercise.-Races use this action.',
    'red:This is the color of apples.-It is a bright color.-Stop signs use this.',
    'bat:This animal flies at night.-It sleeps upside down.-It can see in the dark.',
    'pen:You use this to write.-It has ink inside.-It is found in pencil cases.'
  ],
  4: [
    'book:You read this.-It has many pages.-It can tell a story.',
    'frog:This animal jumps and says ribbit.-It lives near water.-It has long legs.',
    'milk:This white drink comes from cows.-It is good for bones.-You can drink it with cookies.',
    'blue:This is the color of the sky.-It is also in the sea.-Some jeans are this color.',
    'cake:We eat this on birthdays.-It is sweet.-You can put candles on it.',
    'tree:This has leaves and grows tall.-Birds build nests here.-It gives us shade.',
    'fish:This animal swims in water.-It has scales.-It can be kept in a tank.',
    'door:You open this to go in a room.-It has a handle.-You can knock on it.',
    'bird:This animal can fly.-It builds nests.-It lays eggs.'
  ],
  5: [
    'apple:This fruit is red or green.-It grows on trees.-You can make juice with it.',
    'chair:You sit on this.-It has four legs.-It is at the table.',
    'plant:This grows in the ground.-It needs water.-It has leaves.',
    'bread:We eat this with butter.-It is made from wheat.-It is used for sandwiches.',
    'train:This travels on tracks.-It can be very long.-It carries people or goods.',
    'table:We eat dinner on this.-It has a flat top.-It can be made of wood.',
    'smile:You do this when you are happy.-It shows on your face.-It can be contagious.',
    'plane:This flies in the sky.-It has wings.-People travel far with it.',
    'music:You listen to this with your ears.-It can be loud or soft.-People play it on instruments.'
  ],
  6: [
    'planet:Earth is one of these.-They go around the sun.-Mars is another one.',
    'window:You look outside through this.-It is made of glass.-You can open or close it.',
    'school:Children go here to learn.-There are teachers.-You can make friends here.',
    'orange:This fruit is orange.-It is sweet and juicy.-It is a source of vitamin C.',
    'pencil:You write with this in class.-It has an eraser.-It can be sharpened.',
    'circle:This shape is round.-It has no corners.-A clock face is this shape.',
    'flower:This grows in a garden and is pretty.-It can have a nice smell.-Bees love it.',
    'bottle:You drink water from this.-It can be plastic or glass.-It has a cap.',
    'castle:Kings and queens live here.-It has towers.-It is very big and old.'
  ]
};

// --- Table-based Edit Words Tab logic ---
const wordLengths = [3, 4, 5, 6];
let currentEditIndex = 0;
const labels = {
  3: '3-letter words',
  4: '4-letter words',
  5: '5-letter words',
  6: '6-letter words'
};

function showEditWordList(index) {
  currentEditIndex = index;
  document.getElementById('wordListLabel').textContent = labels[wordLengths[index]];
  fillEditWordsTable();
}

function fillEditWordsTable() {
  const len = wordLengths[currentEditIndex];
  const table = document.getElementById('editWordsTable').querySelector('tbody');
  table.innerHTML = '';
  (wordLists[len] || []).forEach((entry, i) => {
    const [word, hintStr] = entry.split(':');
    const hints = (hintStr || '').split('-');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input value="${word || ''}" style="width: 100%; padding:4px;"/></td>
      <td><input value="${hints[0] || ''}" style="width: 100%; padding:4px;"/></td>
      <td><input value="${hints[1] || ''}" style="width: 100%; padding:4px;"/></td>
      <td><input value="${hints[2] || ''}" style="width: 100%; padding:4px;"/></td>
      <td><button onclick="this.parentElement.parentElement.remove();" style="background: #e74c3c; color:white; border:none; border-radius:8px; padding:4px 10px; font-size:1rem; cursor:pointer;">🗑️</button></td>
    `;
    table.appendChild(tr);
  });
}

function addWordRow() {
  const table = document.getElementById('editWordsTable').querySelector('tbody');
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input value="" style="width: 100%; padding:4px;"/></td>
    <td><input value="" style="width: 100%; padding:4px;"/></td>
    <td><input value="" style="width: 100%; padding:4px;"/></td>
    <td><input value="" style="width: 100%; padding:4px;"/></td>
    <td><button onclick="this.parentElement.parentElement.remove();" style="background: #e74c3c; color:white; border:none; border-radius:8px; padding:4px 10px; font-size:1rem; cursor:pointer;">🗑️</button></td>
  `;
  table.appendChild(tr);
}

function saveTableWordList() {
  const len = wordLengths[currentEditIndex];
  const table = document.getElementById('editWordsTable').querySelector('tbody');
  const rows = Array.from(table.querySelectorAll('tr'));
  wordLists[len] = rows.map(tr => {
    const inputs = tr.querySelectorAll('input');
    const word = (inputs[0].value || '').trim().toLowerCase();
    const hint1 = (inputs[1].value || '').trim();
    const hint2 = (inputs[2].value || '').trim();
    const hint3 = (inputs[3].value || '').trim();
    if (!word || !hint1) return null; // skip empty or incomplete
    return `${word}:${hint1}-${hint2}-${hint3}`;
  }).filter(Boolean);
  showToast(`${labels[len]} saved!`);
}

// Navigation
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('prevWordList').onclick = function() {
    if (currentEditIndex > 0) showEditWordList(currentEditIndex - 1);
  };
  document.getElementById('nextWordList').onclick = function() {
    if (currentEditIndex < wordLengths.length - 1) showEditWordList(currentEditIndex + 1);
  };
  // Show the first table if entering edit tab
  document.querySelectorAll('.fixed-bar button, .fixed-bar input').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(document.getElementById('wordsTab').classList.contains('active')) {
        showEditWordList(currentEditIndex);
      }
    });
  });
  // Fill on load if needed
  if(document.getElementById('wordsTab').classList.contains('active')) {
    showEditWordList(0);
  }
});

function showTab(tabId) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  // If entering Edit tab, refresh table
  if(tabId === "wordsTab") showEditWordList(currentEditIndex);
}

function showToast(msg, stay=false) {
  const toast = document.getElementById('toast');
  toast.innerHTML = stay ? `${msg} <button onclick="this.parentElement.style.display='none'">❌</button>` : msg;
  toast.style.display = 'block';
  if (!stay) setTimeout(() => toast.style.display = 'none', 3000);
}

let currentLength = 5;
let solution = '';
let solutionHints = [];
let hintIndex = 0;
let guesses = [];
const maxGuesses = 6;

function drawEmptyRows() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  for (let i = 0; i < maxGuesses; i++) {
    const row = document.createElement('div');
    row.className = 'guess-row';
    row.style.setProperty('--box-count', currentLength);
    row.style.setProperty('--gap', '0.5rem');
    for (let j = 0; j < currentLength; j++) {
      const box = document.createElement('div');
      box.className = 'letter-box';
      box.textContent = "";
      row.appendChild(box);
    }
    board.appendChild(row);
  }
}

function startGame(length) {
  currentLength = length;
  const list = wordLists[length];
  if (!list || list.length === 0) {
    showToast('No words available for this length.', true);
    return;
  }
  const pick = list[Math.floor(Math.random() * list.length)];
  const parts = pick.split(':');
  solution = parts[0];
  solutionHints = parts[1]?.split('-') || [];
  hintIndex = 0;
  guesses = [];
  drawEmptyRows();
  document.getElementById('result').textContent = '';
  document.getElementById('guessInput').value = '';
  showTab('gameTab');
  showToast('Game Started!');
}

function checkGuess() {
  const guess = document.getElementById('guessInput').value.trim().toLowerCase();
  if (guess.length !== currentLength) {
    showToast(`Enter a ${currentLength}-letter word.`);
    return;
  }
  if (guesses.length >= maxGuesses) return;

  guesses.push(guess);
  const row = document.getElementById('board').children[guesses.length - 1];
  [...guess].forEach((char, i) => {
    const box = row.children[i];
    box.textContent = char;
    box.classList.remove('correct', 'present', 'absent');
    if (solution[i] === char) {
      box.classList.add('correct');
    } else if (solution.includes(char)) {
      box.classList.add('present');
    } else {
      box.classList.add('absent');
    }
  });

  if (guess === solution) {
    showToast('🎉 Correct!', true);
    document.getElementById('result').innerHTML = '<button onclick="startGame(currentLength)">Play Again</button>';
    return;
  }
  if (guesses.length === maxGuesses) {
    showToast(`❌ The word was: ${solution}`, true);
    document.getElementById('result').innerHTML = '<button onclick="startGame(currentLength)">Play Again</button>';
  }
  document.getElementById('guessInput').value = '';
}

function showInstructions() {
  showToast("Guess the word in several tries. Use hints if needed.", true);
}

function showHint() {
  if (hintIndex < solutionHints.length) {
    showToast(`Hint: ${solutionHints[hintIndex++]}`, true);
  } else {
    showToast("No more hints.", true);
  }
}

function toggleFullScreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}
</script>

</body>
</html>
