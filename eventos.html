<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portal de Eventos - Spring School</title>
  <!-- ... [mantenha o seu CSS do jeito anterior] ... -->
  <style>
    /* [mesmo CSS do exemplo anterior] */
    :root { --primary-color: #ff69b4; --secondary-color: #4a90e2; /* ... resto igual ... */ }
    /* ... resto do seu CSS ... */
    .hidden { display: none; }
    /* ... */
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<!-- BLOQUEIO POR SENHA -->
<div id="senha-area" style="text-align:center; margin:20px;">
  <input type="password" id="senha-mestra" placeholder="Senha de edição" />
  <button onclick="verificarSenha()">Entrar como editor</button>
</div>

<header>
  <img alt="Logo" class="logo" src="https://springschool.me/wp-content/uploads/2020/12/SPRING-SCHOOL-LOGO-01.png"/>
  <h1>Portal de Eventos</h1>
</header>
<nav>
  <button class="active" onclick="trocarAba('home', event)">🏠 Início</button>
  <button onclick="trocarAba('editar', event)">✏️ Editar</button>
  <button onclick="trocarAba('calendario', event)">📅 Calendário</button>
  <button onclick="trocarAba('galeria', event)">🖼️ Galeria</button>
</nav>
<div class="container" id="aba-home">
  <h2>Next Events</h2>
  <div id="lista-eventos"></div>
</div>
<div class="container hidden" id="aba-evento">
  <div id="event-page"></div>
</div>
<!-- ABA DE EDIÇÃO (fica oculta até digitar a senha correta) -->
<div class="container hidden" id="aba-editar">
  <h2>Adicionar / Editar Evento</h2>
  <button onclick="novoEvento()">+ Novo Evento</button>
  <label for="eventoSelecionado">Selecionar evento existente</label>
  <select id="eventoSelecionado" onchange="carregarEventoNoFormulario()">
    <option value="">-- Escolha um evento --</option>
  </select>
  <form onsubmit="salvarEvento(event)">
    <label for="id">ID do Evento</label>
    <input id="id" required type="text"/>
    <label for="titulo">Título</label>
    <input id="titulo" required type="text"/>
    <label for="data">Data</label>
    <input id="data" required type="date"/>
    <label for="imagem">URL da Imagem</label>
    <input id="imagem" type="text"/>
    <label for="descricao">Descrição</label>
    <textarea id="descricao" rows="6" placeholder="Digite a descrição do evento..."></textarea>
    <button type="submit">Salvar</button>
  </form>
</div>
<div class="container hidden" id="aba-calendario">
  <div class="calendar-layout">
    <div class="calendar-section">
      <div class="calendar-controls">
        <button onclick="mudarMes(-1)">←</button>
        <h3 id="mesAtual"></h3>
        <button onclick="mudarMes(1)">→</button>
      </div>
      <div class="calendar" id="diasCalendario"></div>
    </div>
    <div class="events-section" id="eventosDoMes">
      <h3>Eventos deste mês</h3>
    </div>
  </div>
</div>
<div class="container hidden" id="aba-galeria">
  <h2>Galeria de Fotos dos Eventos</h2>
  <label for="seletorGaleria">Escolha um evento</label>
  <select id="seletorGaleria" onchange="mostrarGaleria()">
    <option value="">-- Selecione um evento --</option>
  </select>
  <div id="galeriaFotos" style="margin-top:1rem; display:flex; flex-wrap:wrap; gap:10px;"></div>
</div>
<footer>© 2025 Spring School</footer>
<script>
  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyAsYg7ZTHXD_a6d_icFLw9e5y0jSTfXBi0",
    authDomain: "spring-stage-by-leo.firebaseapp.com",
    projectId: "spring-stage-by-leo",
    storageBucket: "spring-stage-by-leo.firebasestorage.app",
    messagingSenderId: "215839443924",
    appId: "1:215839443924:web:16a9fae4a0a5da76f16441",
    measurementId: "G-JEE5SLV9YP"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // SENHA MESTRA PARA EDIÇÃO
  const SENHA_EDIT = "spring2024"; // <<< TROQUE POR SUA SENHA!
  // No início, a aba de edição fica oculta
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById('aba-editar').style.display = "none";
  });
  function verificarSenha() {
    const senha = document.getElementById('senha-mestra').value;
    if (senha === SENHA_EDIT) {
      document.getElementById('aba-editar').style.display = "";
      document.getElementById('senha-area').style.display = "none";
      alert("Edição liberada!");
    } else {
      alert("Senha incorreta!");
    }
  }

  // --- RESTANTE DO CÓDIGO: IGUAL AO EXEMPLO FIRESTORE ANTERIOR ---

  let eventos = {};

  function listenToEventos() {
    db.collection("eventos").onSnapshot((snapshot) => {
      eventos = {};
      snapshot.forEach(doc => {
        eventos[doc.id] = doc.data();
      });
      renderizarEventos();
      gerarCalendario();
      atualizarDropdown();
      atualizarGaleria();
    });
  }

  function salvarEvento(ev) {
    ev.preventDefault();
    const id = document.getElementById('id').value.trim();
    if(!id) { alert("ID é obrigatório!"); return; }
    const evento = {
      titulo: document.getElementById('titulo').value,
      data: document.getElementById('data').value,
      imagem: document.getElementById('imagem').value,
      descricao: document.getElementById('descricao').value
    };
    db.collection("eventos").doc(id).set(evento)
      .then(() => {
        alert('Evento salvo!');
        trocarAba('home');
      })
      .catch((e) => alert("Erro ao salvar: " + e));
  }

  function formatarData(dataString) {
    if(!dataString) return "";
    const data = new Date(dataString);
    return data.toLocaleDateString('pt-BR', { 
      day: '2-digit', 
      month: '2-digit', 
      year: 'numeric' 
    });
  }

  function trocarAba(id, evt) {
    document.querySelectorAll("nav button").forEach(btn => btn.classList.remove("active"));
    document.querySelectorAll("[id^='aba-']").forEach(div => div.classList.add("hidden"));
    document.getElementById("aba-" + id).classList.remove("hidden");
    if(evt) evt.target.classList.add("active");
    if (id === "home") renderizarEventos();
    if (id === "editar") atualizarDropdown();
    if (id === "calendario") gerarCalendario();
    if (id === "galeria") atualizarGaleria();
  }

  function renderizarEventos(containerId = 'lista-eventos', highlightId = null) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    for (const [id, e] of Object.entries(eventos)) {
      const div = document.createElement('div');
      div.className = 'event-card';
      if (highlightId === id) div.classList.add('highlight');
      div.innerHTML = `
        <img src="${e.imagem}" alt="${e.titulo}" />
        <h3>${e.titulo}</h3>
        <div class="event-date">${formatarData(e.data)}</div>
        <button onclick="mostrarEvento('${id}')">Ver mais</button>
      `;
      container.appendChild(div);
    }
  }

  function mostrarEvento(id) {
    const e = eventos[id];
    if (!e) return;
    trocarAba('evento');
    const descricaoHtml = (e.descricao || "").replace(/\n/g, '<br>');
    document.getElementById('event-page').innerHTML = `
      <h2>${e.titulo}</h2>
      <img src="${e.imagem}" alt="${e.titulo}" />
      <p><strong>Data:</strong> ${formatarData(e.data)}</p>
      <p>${descricaoHtml}</p>
    `;
  }

  function novoEvento() {
    document.getElementById('id').value = '';
    document.getElementById('titulo').value = '';
    document.getElementById('data').value = '';
    document.getElementById('imagem').value = '';
    document.getElementById('descricao').value = '';
    document.getElementById('eventoSelecionado').value = '';
  }

  function atualizarDropdown() {
    const select = document.getElementById('eventoSelecionado');
    select.innerHTML = '<option value="">-- Escolha um evento --</option>';
    for (const id in eventos) {
      const option = document.createElement('option');
      option.value = id;
      option.textContent = `${id} - ${eventos[id].titulo}`;
      select.appendChild(option);
    }
  }

  function carregarEventoNoFormulario() {
    const id = document.getElementById('eventoSelecionado').value;
    if (!eventos[id]) return;
    const e = eventos[id];
    document.getElementById('id').value = id;
    document.getElementById('titulo').value = e.titulo;
    document.getElementById('data').value = e.data;
    document.getElementById('imagem').value = e.imagem;
    document.getElementById('descricao').value = e.descricao;
  }

  let mesSelecionado = new Date().getMonth();
  let anoSelecionado = new Date().getFullYear();

  function mudarMes(d) {
    mesSelecionado += d;
    if (mesSelecionado > 11) { 
      mesSelecionado = 0; 
      anoSelecionado++; 
    }
    if (mesSelecionado < 0) { 
      mesSelecionado = 11; 
      anoSelecionado--; 
    }
    gerarCalendario();
  }

  function gerarCalendario() {
    const containerDias = document.getElementById('diasCalendario');
    const containerMes = document.getElementById('mesAtual');
    const containerCards = document.getElementById('eventosDoMes');
    containerDias.innerHTML = '';
    containerCards.innerHTML = '<h3>Eventos deste mês</h3>';
    const diasSemana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
    diasSemana.forEach(dia => {
      const div = document.createElement('div');
      div.className = 'weekday';
      div.textContent = dia;
      containerDias.appendChild(div);
    });
    const nomes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    containerMes.textContent = `${nomes[mesSelecionado]} ${anoSelecionado}`;
    const primeiroDia = new Date(anoSelecionado, mesSelecionado, 1).getDay();
    const diasNoMes = new Date(anoSelecionado, mesSelecionado + 1, 0).getDate();
    for (let i = 0; i < primeiroDia; i++) {
      containerDias.appendChild(document.createElement('div'));
    }
    for (let dia = 1; dia <= diasNoMes; dia++) {
      const dataStr = `${anoSelecionado}-${String(mesSelecionado + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
      const eventoId = Object.keys(eventos).find(id => eventos[id].data === dataStr);
      const div = document.createElement('div');
      div.className = eventoId ? 'day event-day' : 'day';
      div.textContent = dia;
      if (eventoId) {
        div.onclick = () => {
          const eventosDoDia = Object.entries(eventos).filter(([id, ev]) => ev.data === dataStr);
          const container = document.getElementById('eventosDoMes');
          container.innerHTML = `<h3>Eventos em ${dia}/${mesSelecionado + 1}/${anoSelecionado}</h3>`;
          eventosDoDia.forEach(([id, e]) => {
            const eventDiv = document.createElement('div');
            eventDiv.className = 'event-card highlight';
            eventDiv.innerHTML = `
              <img src="${e.imagem}" alt="${e.titulo}" />
              <h3>${e.titulo}</h3>
              <div class="event-date">${formatarData(e.data)}</div>
              <button onclick="mostrarEvento('${id}')">Ver mais</button>`;
            container.appendChild(eventDiv);
          });
        };
      }
      containerDias.appendChild(div);
    }
    const eventosDoMes = Object.entries(eventos).filter(([id, ev]) => {
      const dataEvento = new Date(ev.data);
      return dataEvento.getMonth() === mesSelecionado && dataEvento.getFullYear() === anoSelecionado;
    });
    if (eventosDoMes.length === 0) {
      containerCards.innerHTML += '<p>Nenhum evento neste mês.</p>';
    } else {
      eventosDoMes.forEach(([id, e]) => {
        const eventDiv = document.createElement('div');
        eventDiv.className = 'event-card';
        eventDiv.innerHTML = `
          <img src="${e.imagem}" alt="${e.titulo}" />
          <h3>${e.titulo}</h3>
          <div class="event-date">${formatarData(e.data)}</div>
          <button onclick="mostrarEvento('${id}')">Ver mais</button>`;
        containerCards.appendChild(eventDiv);
      });
    }
  }

  function atualizarGaleria() {
    const seletor = document.getElementById('seletorGaleria');
    if (!seletor) return;
    seletor.innerHTML = '<option value="">-- Selecione um evento --</option>';
    for (const id in eventos) {
      const option = document.createElement('option');
      option.value = id;
      option.textContent = eventos[id].titulo;
      seletor.appendChild(option);
    }
    mostrarGaleria();
  }

  function mostrarGaleria() {
    const seletor = document.getElementById('seletorGaleria');
    const galeria = document.getElementById('galeriaFotos');
    galeria.innerHTML = '';
    const id = seletor.value;
    if (!id || !eventos[id]) return;
    galeria.innerHTML = `<img src="${eventos[id].imagem}" alt="Imagem do evento" style="width:200px; border-radius:8px;">`;
  }

  document.addEventListener("DOMContentLoaded", () => {
    listenToEventos();
    const hash = location.hash;
    if (hash.startsWith("#evento=")) {
      const id = hash.split("=")[1];
      mostrarEvento(id);
      trocarAba('evento');
    }
  });
</script>
</body>
</html>
