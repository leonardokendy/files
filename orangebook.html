<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Áudio Book</title>
  <style>
    body {
      font-family: sans-serif;
      background: #F25C19;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: 200px;
      margin-bottom: 2rem;
      border-radius: 1rem;
      overflow: hidden;
    }
    .search-box {
      background: #F99F2A;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
      text-align: center;
      color: white;
    }
    .search-box label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }
    .search-box select, .search-box button {
      padding: 0.5rem;
      font-size: 1rem;
      margin: 0.5rem;
      border-radius: 0.5rem;
      border: none;
    }
    .search-box button {
      background: #fff;
      color: #F25C19;
      font-weight: bold;
      cursor: pointer;
    }
    .audio-player {
      background: #fff;
      padding: 1rem;
      border-radius: 1rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: none;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    audio {
      width: 100%;
    }
  </style>
</head>
<body>
  <img src="https://springschool.me/wp-content/uploads/2020/12/SPRING-SCHOOL-LOGO-01.png" alt="Logo da Escola" class="logo">

  <div class="search-box">
    <label for="pageSelect">PAGE</label>
    <select id="pageSelect" onchange="updateExercises()">
      <option value="">Selecione</option>
    </select>

    <label for="exSelect">ACT</label>
    <select id="exSelect">
      <option value="">Selecione</option>
    </select>

    <br>
    <button onclick="searchAudio()">Buscar</button>
  </div>

  <div class="audio-player" id="audioContainer">
    <p id="audioTitle"></p>
    <audio controls id="audioElement">
      <source id="audioSource" src="" type="audio/mp4">
      Seu navegador não suporta áudio.
    </audio>
  </div>

  <script>
    const audioMap = {
      "3": ["C"], "5": ["E"], "6": ["G"], "8": ["K"], "16": ["R", "S"],
      "23": ["G"], "28": ["K"], "29": ["M"], "30": ["O"], "31": ["P"],
      "34": ["C"], "35": ["E"], "39": ["L"], "41": ["O"], "43": ["R"],
      "45": ["D"], "49": ["E", "F"], "52": ["H"], "53": ["J", "K"], "58": ["D"],
      "59": ["E"], "63": ["J"], "66": ["N"], "73": ["U", "V"], "74": ["W"],
      "77": ["D"], "80": ["E"], "82": ["G"], "83": ["I"], "86": ["N"], "87": ["P"],
      "89": ["R"], "93": ["E"], "96": ["J"], "99": ["N"], "102": ["R", "S", "T"],
      "103": ["U"], "107": ["C"], "108": ["E"], "110": ["H"], "113": ["J"],
      "118": ["O"], "120": ["Q"], "123": ["D"], "129": ["G"], "130": ["I"],
      "132": ["L"], "137": ["P"], "141": ["D"], "143": ["F"], "145": ["J"],
      "147": ["M"], "150": ["P"], "151": ["R", "S"], "153": ["E"]
    };

    const pageSelect = document.getElementById("pageSelect");
    const exSelect = document.getElementById("exSelect");

    document.addEventListener("DOMContentLoaded", () => {
  const allPages = Object.keys(audioMap).sort((a, b) => a - b);
  allPages.forEach(page => {
    const option = document.createElement("option");
    option.value = page;
    option.textContent = page;
    pageSelect.appendChild(option);
  });
});

    function updateExercises() {
      const selectedPage = pageSelect.value;
      exSelect.innerHTML = '<option value="">Selecione</option>';
      if (audioMap[selectedPage]) {
        audioMap[selectedPage].forEach(letter => {
          const opt = document.createElement("option");
          opt.value = letter;
          opt.textContent = letter;
          exSelect.appendChild(opt);
        });
      }
    }

    function searchAudio() {
      const page = pageSelect.value;
      const ex = exSelect.value;
      if (!page || !ex) {
        alert("Por favor, selecione a página e o exercício.");
        return;
      }
      const filename = `Pg.${page}%20Ex%20${ex}%20.m4a`;
      const audioSource = document.getElementById("audioSource");
      const audioElement = document.getElementById("audioElement");
      const audioContainer = document.getElementById("audioContainer");
      const audioTitle = document.getElementById("audioTitle");
      audioSource.src = filename;
      audioElement.load();
      audioTitle.innerText = `Pg.${page} Ex ${ex}`;
      audioContainer.style.display = "block";
    }
  </script>
</body>
</html>
