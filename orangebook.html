<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Áudio Book</title>
  <style>
    body {
      font-family: sans-serif;
      background: #F25C19;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: 200px;
      margin-bottom: 2rem;
      border-radius: 1rem;
      overflow: hidden;
    }
    .search-box {
      background: #F99F2A;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
      text-align: center;
      color: white;
    }
    .search-box label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }
    .search-box select, .search-box button {
      padding: 0.5rem;
      font-size: 1rem;
      margin: 0.5rem;
      border-radius: 0.5rem;
      border: none;
    }
    .search-box button {
      background: #fff;
      color: #F25C19;
      font-weight: bold;
      cursor: pointer;
    }
    .audio-player {
      background: #fff;
      padding: 1rem;
      border-radius: 1rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: none;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    audio {
      width: 100%;
    }
  </style>
</head>
<body>
  <img src="https://springschool.me/wp-content/uploads/2020/12/SPRING-SCHOOL-LOGO-01.png" alt="Logo da Escola" class="logo">

  <div class="search-box">
    <label for="pageSelect">PAGE</label>
    <select id="pageSelect" onchange="updateExercises()">
      <option value="">Selecione</option>
    </select>

    <label for="exSelect">ACT</label>
    <select id="exSelect">
      <option value="">Selecione</option>
    </select>

    <br>
    <button onclick="searchAudio()">Buscar</button>
  </div>

  <div class="audio-player" id="audioContainer">
    <p id="audioTitle"></p>
    <audio controls id="audioElement">
      <source id="audioSource" src="" type="audio/mp4">
      Seu navegador não suporta áudio.
    </audio>
  </div>

  <script>
    const audioMap = {
  "01": { "T1": "01%20Track%2001%201.m4a", "T2": "01%20Track%2001.m4a" },
  "3": { "C": "Pg.3%20Ex%20C.m4a" },
  "5": { "E": "Pg.5%20Ex%20E.m4a" },
  "6": { "G": "Pg.6%20Ex%20G.m4a" },
  "8": { "K": "Pg.8%20Ex%20K.m4a" },
  "16": { "R": "Pg.16%20Ex%20R.m4a", "S": "Pg.16%20Ex%20S.m4a" },

  "28": { "K": "Pg.28%20Ex%20K.m4a" },
  "29": { "M": "Pg.29%20Ex%20M%20.m4a" },

  "35": { "E": "Pg.35%20Ex%20E%20%5D.m4a" },
  "39": { "L": "Pg.39%20Ex%20L%20.m4a" },
  "41": { "O": "Pg.41%20Ex%20O%20.m4a" },
  "43": { "R": "Pg.43%20Ex%20R%20.m4a" },
  "45": { "D": "Pg.45%20Ex%20D%20.m4a" },

  "52": { "H": "Pg.52%20Ex%20H%20.m4a" },
  "53": { "J": "Pg.53%20Ex%20J%20.m4a", "K": "Pg.53%20Ex%20K%20.m4a" },
  "58": { "D": "Pg.58%20Ex%20D%20.m4a" },
  "59": { "E": "Pg.59%20Ex%20E%20.m4a" },
  "63": { "J": "Pg.63%20Ex%20J%20.m4a" },
  "66": { "N": "Pg.66%20Ex%20N%20.m4a" },
  "73": { "U": "Pg.73%20Ex%20U%20.m4a", "V": "Pg.73%20Ex%20V%20.m4a" },

  "102": { "R": "Pg.102%20Ex%20R%20.m4a", "S": "Pg.102%20Ex%20S%20.m4a", "T": "Pg.102%20Ex%20T%20.m4a" },
  "103": { "U": "Pg.103%20Ex%20U%20.m4a" },

  "120": { "Q": "Pg.120%20Ex%20Q%20.m4a" },
  "123": { "D": "Pg.123%20Ex%20D%20.m4a" },
  "129": { "G": "Pg.129%20Ex%20G%20.m4a" },

  "150": { "P": "Pg.150%20Ex%20P%20.m4a" },
  "151": { "R": "Pg.151%20Ex%20R%20.m4a", "S": "Pg.151%20Ex%20S%20.m4a" },
  "153": { "E": "Pg.153%20Ex%20E%20.m4a" }
};

    const pageSelect = document.getElementById("pageSelect");
    const exSelect = document.getElementById("exSelect");

    document.addEventListener("DOMContentLoaded", () => {
      const allPages = Object.keys(audioMap).sort((a, b) => a - b);
      allPages.forEach(page => {
        const option = document.createElement("option");
        option.value = page;
        option.textContent = page;
        pageSelect.appendChild(option);
      });
    });

    function updateExercises() {
      const selectedPage = pageSelect.value;
      exSelect.innerHTML = '<option value="">Selecione</option>';
      if (audioMap[selectedPage]) {
        Object.keys(audioMap[selectedPage]).forEach(letter => {
          const opt = document.createElement("option");
          opt.value = letter;
          opt.textContent = letter;
          exSelect.appendChild(opt);
        });
      }
    }

    function searchAudio() {
      const page = pageSelect.value;
      const ex = exSelect.value;
      if (!page || !ex) {
        alert("Por favor, selecione a página e o exercício.");
        return;
      }
      const filename = `https://github.com/leonardokendy/files/raw/orangebook/${audioMap[page][ex]}`;
      const audioSource = document.getElementById("audioSource");
      const audioElement = document.getElementById("audioElement");
      const audioContainer = document.getElementById("audioContainer");
      const audioTitle = document.getElementById("audioTitle");
      audioSource.src = filename;
      audioElement.load();
      audioTitle.innerText = `Pg.${page} Ex ${ex}`;
      audioContainer.style.display = "block";
    }
  </script>
</body>
</html>
