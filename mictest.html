<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>English Speaking Drill</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: sans-serif; text-align: center; background: #f3f7fa; padding: 2rem; }
    #prompt { font-size: 1.5rem; margin: 2rem 0; min-height: 2.5em; }
    #micBtn {
      background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%);
      color: #333; border: none; padding: 2rem 4rem;
      font-size: 1.4rem; border-radius: 50px; cursor: pointer;
      transition: background 0.2s, color 0.2s;
      margin-bottom: 2rem;
    }
    #micBtn.listening {
      background: linear-gradient(120deg, #43e97b 0%, #38f9d7 100%);
      color: #1a1a1a;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 #38f9d788; }
      70% { box-shadow: 0 0 0 24px #38f9d700; }
      100% { box-shadow: 0 0 0 0 #38f9d700; }
    }
    #heardText { font-size: 1.2rem; margin-top: 1.2rem; min-height: 2rem; }
    #feedback { font-size: 2rem; margin: 1rem 0 0.5rem 0; min-height: 2.2rem;}
    #progress { margin-top: 1.5rem; color: #888; }
  </style>
</head>
<body>
  <div id="prompt">Loading...</div>
  <button id="micBtn" aria-label="Hold to Speak" tabindex="0">🎤 Hold to Speak</button>
  <div id="heardText">Say the answer!</div>
  <div id="feedback"></div>
  <div id="progress"></div>
  <script>
    // Remove toda pontuação e espaços extras, case-insensitive
    function normalize(str) {
      return str
        .toLowerCase()
        .replace(/[\.,\/#!$%\^&\*;:{}=\-_`~()\?\!'"\[\]\\@]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    // GRANDE BANCO DE FRASES - Edite aqui
    const QA = [
      // Unit 1 - Names
      { prompt: "What's your name?", answer: "My name is Nicholas." },
      { prompt: "What's your name?", answer: "My name is Madison." },
      { prompt: "What's your name?", answer: "My name is Jennifer." },
      { prompt: "What's your name?", answer: "My name is Emily." },
      { prompt: "What's your name?", answer: "My name is Joshua." },
      { prompt: "What's your name?", answer: "My name is Isabella." },
      { prompt: "What's your name?", answer: "My name is Michael." },
      { prompt: "What's your name?", answer: "My name is William." },
      { prompt: "What's your name?", answer: "My name is Elizabeth." },
      { prompt: "What's his name?", answer: "His name is Joshua." },
      { prompt: "What's her name?", answer: "Her name is Isabella." },
      { prompt: "What's your nickname?", answer: "My nickname is Mike." },
      { prompt: "What's your nickname?", answer: "My nickname is Em." },
      // Unit 1 - Greetings
      { prompt: "How are you?", answer: "I'm fine, thank you." },
      { prompt: "How are you?", answer: "I'm good, thank you." },
      { prompt: "How are you?", answer: "I'm great, thanks." },
      { prompt: "Hello.", answer: "Hi." },
      { prompt: "Hi.", answer: "Hello." },
      { prompt: "Nice to meet you.", answer: "Nice to meet you, too." },
      // Unit 2 - Objects/Location
      { prompt: "What's this?", answer: "It's a flash drive." },
      { prompt: "What's this?", answer: "It's a laptop." },
      { prompt: "What are these?", answer: "They're flash drives." },
      { prompt: "Is this your wallet?", answer: "Yes, it is." },
      { prompt: "Is this your wallet?", answer: "No, it's not." },
      { prompt: "Are these your keys?", answer: "Yes, they are." },
      { prompt: "Are these your keys?", answer: "No, they're not." },
      { prompt: "Where's your wallet?", answer: "It's in my pocket." },
      { prompt: "Where are my keys?", answer: "They're on the table." },
      { prompt: "Where's the book?", answer: "It's on the desk." },
      { prompt: "Where's the pen?", answer: "It's under the chair." },
      { prompt: "Where is the eraser?", answer: "It's next to the notebook." },
      // Unit 3 - Places and people
      { prompt: "Are you from Brazil?", answer: "Yes, I am." },
      { prompt: "Are you from Japan?", answer: "No, I'm not." },
      { prompt: "Are you from São Paulo?", answer: "Yes, I am." },
      { prompt: "Are you from São Paulo?", answer: "No, I'm not." },
      { prompt: "Is she from the U.S.?", answer: "Yes, she is." },
      { prompt: "Is she from the U.S.?", answer: "No, she's not." },
      { prompt: "Where are you from?", answer: "I'm from Brazil." },
      { prompt: "Where are you from?", answer: "I'm from Japan." },
      { prompt: "Where are you from?", answer: "I'm from the United States." },
      { prompt: "Where are you from?", answer: "I'm from Canada." },
      { prompt: "Where are you from?", answer: "I'm from Egypt." },
      { prompt: "What's your nationality?", answer: "I'm Brazilian." },
      { prompt: "What's your nationality?", answer: "I'm Japanese." },
      { prompt: "What's your nationality?", answer: "I'm American." },
      { prompt: "What's your nationality?", answer: "I'm Chinese." },
      { prompt: "Who's that?", answer: "She's my sister." },
      { prompt: "Who's that?", answer: "He's my brother." },
      { prompt: "How old is she?", answer: "She's twenty-eight." },
      { prompt: "How old are you?", answer: "I'm twenty-two." },
      { prompt: "What's she like?", answer: "She's very nice." },
      { prompt: "What's he like?", answer: "He's very funny." },
      // Unit 4 - Clothes, weather
      { prompt: "Are you wearing gloves?", answer: "Yes, I am." },
      { prompt: "Are you wearing gloves?", answer: "No, I'm not." },
      { prompt: "Is she wearing boots?", answer: "Yes, she is." },
      { prompt: "Is she wearing boots?", answer: "No, she's not." },
      { prompt: "What are you wearing?", answer: "I'm wearing a new gray suit." },
      { prompt: "What are you wearing?", answer: "I'm wearing a T-shirt and jeans." },
      { prompt: "What is the weather like?", answer: "It's sunny, but it's cold." },
      { prompt: "What is the weather like?", answer: "It's raining." },
      { prompt: "What is the weather like?", answer: "It's windy and cold." },
      { prompt: "What season is it?", answer: "It's winter." },
      { prompt: "What season is it?", answer: "It's summer." },
      // Unit 5 - Time and routines
      { prompt: "What time is it?", answer: "It's two o'clock." },
      { prompt: "What time is it?", answer: "It's five after two." },
      { prompt: "What time is it?", answer: "It's a quarter after two." },
      { prompt: "What time is it?", answer: "It's half past two." },
      { prompt: "What time is it?", answer: "It's twenty to three." },
      { prompt: "What time is it?", answer: "It's a quarter to three." },
      { prompt: "Is it A.M. or P.M.?", answer: "It's six in the morning." },
      { prompt: "Is it A.M. or P.M.?", answer: "It's four in the afternoon." },
      { prompt: "What's Daniel doing?", answer: "He's sleeping right now." },
      { prompt: "What are Lya and Erin doing?", answer: "They're having breakfast." },
      { prompt: "What are you doing?", answer: "I'm studying English." },
      { prompt: "What are you doing?", answer: "I'm watching a movie." },
      // Unit 6 - Transportation and routines
      { prompt: "How do you go to school?", answer: "I walk to school." },
      { prompt: "How do you go to school?", answer: "I ride my bike to school." },
      { prompt: "How do you go to work?", answer: "I take the train to work." },
      { prompt: "How do you go to work?", answer: "I take the bus to work." },
      { prompt: "How does she go to work?", answer: "She takes the subway to work." },
      { prompt: "How does he go to work?", answer: "He drives to work." },
      { prompt: "Do you get up early on Sundays?", answer: "No, I get up late." },
      { prompt: "Do you get up early on Sundays?", answer: "Yes, I get up early." },
      { prompt: "Does he eat breakfast at seven o'clock?", answer: "No, he eats breakfast at seven-thirty." },
      { prompt: "Does he eat breakfast at seven o'clock?", answer: "Yes, he does." },
      { prompt: "What time do you get up?", answer: "At noon." },
      { prompt: "What time do you get up?", answer: "At seven o'clock." },
      { prompt: "When do they take the subway?", answer: "On Mondays and Wednesdays." },
      { prompt: "When do they take the subway?", answer: "On weekends." },
      // General
      { prompt: "What do you like to do?", answer: "I like to play basketball." },
      { prompt: "What do you like to do?", answer: "I like to listen to music." },
      { prompt: "What do you like to do?", answer: "I like to read." },
      { prompt: "What language do you speak?", answer: "I speak English." },
      { prompt: "What language do you speak?", answer: "I speak Portuguese." }
    ];

    // --- NAVEGAÇÃO ---
    const promptEl = document.getElementById("prompt");
    const micBtn = document.getElementById("micBtn");
    const heardText = document.getElementById("heardText");
    const feedback = document.getElementById("feedback");
    const progress = document.getElementById("progress");

    let idx = 0;

    function showQA() {
      promptEl.textContent = QA[idx].prompt;
      feedback.textContent = "";
      heardText.textContent = "Say the answer!";
      progress.textContent = `(${idx+1}/${QA.length})`;
    }

    // Reconhecimento de voz
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      heardText.textContent = "Speech Recognition not supported!";
      micBtn.disabled = true;
    }

    let recognition;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.continuous = false;

      recognition.onstart = () => {
        micBtn.classList.add("listening");
        micBtn.textContent = "🎙️ Listening...";
      };

      recognition.onend = () => {
        micBtn.classList.remove("listening");
        micBtn.textContent = "🎤 Hold to Speak";
        isListening = false;
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        heardText.textContent = `Heard: "${transcript}"`;
        // Compara ignorando pontuação
        if(normalize(transcript) === normalize(QA[idx].answer)){
          feedback.textContent = "✅";
          setTimeout(() => {
            idx++;
            if(idx >= QA.length) {
              promptEl.textContent = "Well done! Finished.";
              feedback.textContent = "🏆";
              heardText.textContent = "";
              progress.textContent = "";
              micBtn.disabled = true;
            } else {
              showQA();
            }
          }, 800);
        } else {
          feedback.textContent = "❌";
        }
      };

      recognition.onerror = (e) => {
        heardText.textContent = "Error: " + e.error;
        isListening = false;
        micBtn.classList.remove("listening");
        micBtn.textContent = "🎤 Hold to Speak";
      };

      // Mouse/touch events
      micBtn.addEventListener("mousedown", () => {
        if (!isListening) {
          try { recognition.start(); isListening = true; } catch (e) {}
        }
      });
      micBtn.addEventListener("mouseup", () => {
        if (isListening) { recognition.stop(); isListening = false; }
      });
      micBtn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        if (!isListening) {
          try { recognition.start(); isListening = true; } catch (e) {}
        }
      });
      micBtn.addEventListener("touchend", (e) => {
        e.preventDefault();
        if (isListening) { recognition.stop(); isListening = false; }
      });
    }

    showQA();
  </script>
</body>
</html>
