<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Repeat the Phrase - Smart Matching</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: sans-serif; text-align: center; background: #f3f7fa; padding: 2rem; }
    #prompt { font-size: 1.5rem; margin: 2rem 0; min-height: 2.5em; }
    #micBtn {
      background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%);
      color: #333; border: none; padding: 2rem 4rem;
      font-size: 1.4rem; border-radius: 50px; cursor: pointer;
      transition: background 0.2s, color 0.2s;
      margin-bottom: 2rem;
    }
    #micBtn.listening {
      background: linear-gradient(120deg, #43e97b 0%, #38f9d7 100%);
      color: #1a1a1a;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 #38f9d788; }
      70% { box-shadow: 0 0 0 24px #38f9d700; }
      100% { box-shadow: 0 0 0 0 #38f9d700; }
    }
    #heardText { font-size: 1.2rem; margin-top: 1.2rem; min-height: 2rem; }
    #feedback { font-size: 2rem; margin: 1rem 0 0.5rem 0; min-height: 2.2rem;}
    #progress { margin-top: 1.5rem; color: #888; }
  </style>
</head>
<body>
  <div id="prompt">Loading...</div>
  <button id="micBtn" aria-label="Hold to Speak" tabindex="0">🎤 Hold to Speak</button>
  <div id="heardText">Repeat the phrase above!</div>
  <div id="feedback"></div>
  <div id="progress"></div>
  <!-- Feedback sounds -->
  <audio id="audio-success" preload="auto">
    <source src="https://cdn.pixabay.com/audio/2022/10/16/audio_12a43981b5.mp3" type="audio/mpeg">
  </audio>
  <audio id="audio-error" preload="auto">
    <source src="https://cdn.pixabay.com/audio/2022/10/16/audio_12cdbb89b1.mp3" type="audio/mpeg">
  </audio>
  <script>
    // -- Number-to-words map (0-100) --
    const numberWords = {
      0:"zero", 1:"one", 2:"two", 3:"three", 4:"four", 5:"five", 6:"six", 7:"seven", 8:"eight", 9:"nine",
      10:"ten",11:"eleven",12:"twelve",13:"thirteen",14:"fourteen",15:"fifteen",16:"sixteen",17:"seventeen",
      18:"eighteen",19:"nineteen",20:"twenty",30:"thirty",40:"forty",50:"fifty",60:"sixty",70:"seventy",
      80:"eighty",90:"ninety",100:"one hundred"
    };
    function numberToWords(num) {
      num = parseInt(num,10);
      if (numberWords[num]) return numberWords[num];
      if (num < 100) {
        let tens = Math.floor(num/10)*10, ones = num%10;
        return numberWords[tens] + " " + numberWords[ones];
      }
      return num.toString();
    }
    function wordsToNumber(str) {
      // Only for 0-100 for this app; can be expanded if needed
      str = str.replace(/-/g," ");
      let nums = {};
      for(let i=0;i<=100;i++) {
        let w = numberToWords(i);
        nums[w] = i+"";
      }
      return nums[str.trim()] || null;
    }

    // -- Normalize input for robust matching --
    function normalize(str) {
      str = str.toLowerCase()
        .replace(/[\.,\/#!$%\^&\*;:{}=\-_`~()\?\!'"\[\]\\@]/g, '')
        .replace(/\s+/g, ' ')
        .trim();

      // American/British color
      str = str.replace(/\bgrey\b/g, 'gray');
      // Okay/ok
      str = str.replace(/\bokay\b/g, 'ok');
      // Numbers: replace any number word (up to 100) with its digit, and any digit with its number word
      // e.g., "twenty eight" <-> 28
      // First: numbers as digits → words
      str = str.replace(/\b([0-9]{1,3})\b/g, function(match) {
        let w = numberToWords(match);
        return w ? w : match;
      });
      // Now, number words → digits (rare in this code, since we keep words as model, but for robustness)
      for (let i=0;i<=100;i++) {
        let w = numberToWords(i);
        // Avoid matching inside other words
        let re = new RegExp("\\b"+w+"\\b", "g");
        str = str.replace(re, w); // Actually, keep as words for comparison
      }
      return str;
    }

    // -- Phrases for shadowing (add/edit freely) --
    const PHRASES = [
      "What's your name?",
      "My name is Nicholas.",
      "Nice to meet you.",
      "How are you?",
      "Hello.",
      "I'm fine, thank you.",
      "She's twenty-eight.",
      "He's twenty eight.",
      "I have twenty-eight books.",
      "My favorite color is gray.",
      "My favorite color is grey.",
      // Unit 2
      "What's this?",
      "It's a flash drive.",
      "Is this your wallet?",
      "Yes, it is.",
      "No, it's not.",
      "Where's your wallet?",
      "It's in my pocket.",
      // Unit 3
      "Where are you from?",
      "I'm from Brazil.",
      "Are you from Japan?",
      "No, I'm not.",
      "Who's that?",
      "She's my sister.",
      "He's my brother.",
      // Unit 4
      "Are you wearing gloves?",
      "Yes, I am.",
      "No, I'm not.",
      "What are you wearing?",
      "I'm wearing a new gray suit.",
      "It's sunny, but it's cold.",
      // Unit 5
      "What time is it?",
      "It's two o'clock.",
      "It's a quarter after two.",
      "It's six in the morning.",
      "What's Daniel doing?",
      "He's sleeping right now.",
      // Unit 6
      "How do you go to school?",
      "I walk to school.",
      "Do you get up early on Sundays?",
      "No, I get up late.",
      "What time do you get up?",
      "At seven o'clock.",
      "What do you like to do?",
      "I like to play basketball.",
      "I speak English.",
      "On Mondays and Wednesdays."
    ];

    // -- Main code --
    const audioSuccess = document.getElementById('audio-success');
    const audioError = document.getElementById('audio-error');
    const promptEl = document.getElementById("prompt");
    const micBtn = document.getElementById("micBtn");
    const heardText = document.getElementById("heardText");
    const feedback = document.getElementById("feedback");
    const progress = document.getElementById("progress");

    let idx = 0;

    function showPhrase() {
      promptEl.textContent = PHRASES[idx];
      feedback.textContent = "";
      heardText.textContent = "Repeat the phrase above!";
      progress.textContent = `(${idx+1}/${PHRASES.length})`;
    }

    // Speech recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      heardText.textContent = "Speech Recognition not supported!";
      micBtn.disabled = true;
    }

    let recognition;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.continuous = false;

      recognition.onstart = () => {
        micBtn.classList.add("listening");
        micBtn.textContent = "🎙️ Listening...";
      };

      recognition.onend = () => {
        micBtn.classList.remove("listening");
        micBtn.textContent = "🎤 Hold to Speak";
        isListening = false;
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        heardText.textContent = `Heard: "${transcript}"`;
        if(normalize(transcript) === normalize(PHRASES[idx])){
          feedback.textContent = "✅";
          audioSuccess.currentTime = 0;
          audioSuccess.play();
          setTimeout(() => {
            idx++;
            if(idx >= PHRASES.length) {
              promptEl.textContent = "Well done! Finished.";
              feedback.textContent = "🏆";
              heardText.textContent = "";
              progress.textContent = "";
              micBtn.disabled = true;
            } else {
              showPhrase();
            }
          }, 800);
        } else {
          feedback.textContent = "❌";
          audioError.currentTime = 0;
          audioError.play();
        }
      };

      recognition.onerror = (e) => {
        heardText.textContent = "Error: " + e.error;
        isListening = false;
        micBtn.classList.remove("listening");
        micBtn.textContent = "🎤 Hold to Speak";
      };

      // Mouse/touch events
      micBtn.addEventListener("mousedown", () => {
        if (!isListening) {
          try { recognition.start(); isListening = true; } catch (e) {}
        }
      });
      micBtn.addEventListener("mouseup", () => {
        if (isListening) { recognition.stop(); isListening = false; }
      });
      micBtn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        if (!isListening) {
          try { recognition.start(); isListening = true; } catch (e) {}
        }
      });
      micBtn.addEventListener("touchend", (e) => {
        e.preventDefault();
        if (isListening) { recognition.stop(); isListening = false; }
      });
    }

    showPhrase();
  </script>
</body>
</html>
