<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hold to Speak</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 2rem;
    }

    #micBtn {
      background-color: #ccc;
      color: black;
      border: none;
      padding: 2rem 4rem;
      font-size: 1.5rem;
      border-radius: 50px;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }

    #micBtn.listening {
      background-color: green;
      color: white;
    }

    #heardText {
      margin-top: 2rem;
      font-size: 1.4rem;
      min-height: 2rem;
    }

    #hint {
      margin-top: 2rem;
      font-style: italic;
      color: gray;
    }
  </style>
</head>
<body>

  <button id="micBtn">🎤 Hold to Speak</button>
  <div id="heardText">Waiting for speech...</div>
  <div id="hint">💡 Try saying: "jump"</div>

  <script>
    const micBtn = document.getElementById("micBtn");
    const heardText = document.getElementById("heardText");

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.continuous = false;

    let isListening = false;

    recognition.onstart = () => {
      micBtn.classList.add("listening");
      micBtn.textContent = "🎙️ Listening...";
    };

    recognition.onend = () => {
      micBtn.classList.remove("listening");
      micBtn.textContent = "🎤 Hold to Speak";
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript.toLowerCase();
      heardText.textContent = `Heard: "${transcript}"`;

      if (transcript.includes("jump")) {
        heardText.textContent += " ✅ Command: JUMP!";
      } else {
        heardText.textContent += " ❌ Command not recognized";
      }
    };

    recognition.onerror = (e) => {
      heardText.textContent = "Error: " + e.error;
    };

    // Start on press
    micBtn.addEventListener("mousedown", () => {
      try {
        recognition.start();
        isListening = true;
      } catch (e) {
        console.log("Already listening...");
      }
    });

    // Stop on release
    micBtn.addEventListener("mouseup", () => {
      if (isListening) {
        recognition.stop();
        isListening = false;
      }
    });

    // For touchscreens
    micBtn.addEventListener("touchstart", (e) => {
      e.preventDefault(); // Prevents accidental zoom
      try {
        recognition.start();
        isListening = true;
      } catch (e) {
        console.log("Already listening...");
      }
    });

    micBtn.addEventListener("touchend", (e) => {
      e.preventDefault();
      if (isListening) {
        recognition.stop();
        isListening = false;
      }
    });
  </script>

</body>
</html>
